{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <h2>Checkout</h2>
    <p>Resumen de tu pedido:</p>
    <ul>
        {% for item in items %}
            <li>{{ item.nombre }} x {{ item.cantidad }} - ${{ item.subtotal }}</li>
        {% endfor %}
    </ul>
    <h3>Total: ${{ totales.total }}</h3>
</div>
{% endblock %}

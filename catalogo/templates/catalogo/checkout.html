{% extends 'base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <h2>Checkout</h2>
    <div class="card p-4 shadow-sm">
        <h5>Resumen de tu pedido:</h5>
        <ul class="list-group list-group-flush mb-3">
            {% for item in items %}
            <li class="list-group-item d-flex justify-content-between">
                <span>{{ item.nombre }} x {{ item.cantidad }}</span>
                <span>${{ item.subtotal }}</span>
            </li>
            {% endfor %}
        </ul>
        <h4 class="mb-4">Total: ${{ totales.total }}</h4>

        <form id="payment-form">
            {% csrf_token %}
            <label for="card-element" class="form-label fw-bold">Datos de Tarjeta (Prueba: 4242 4242 4242 4242)</label>
            <div id="card-element" class="form-control p-3 mb-3"></div>
            <div id="card-errors" class="text-danger mb-3" role="alert"></div>
            <button id="submit-btn" type="submit" class="btn btn-success w-100">
                Pagar ${{ totales.total }}
            </button>
        </form>
    </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
    const stripe = Stripe("{{ publishable_key }}");
    const elements = stripe.elements();
    const card = elements.create("card");
    card.mount("#card-element");

    const form = document.getElementById("payment-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorDiv = document.getElementById("card-errors");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        errorDiv.textContent = "";

        const resp = await fetch("{% url 'catalogo:checkout' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/json"
            }
        });
        const data = await resp.json();

        if (!resp.ok || data.error) {
            errorDiv.textContent = data.error || "Error al iniciar el pago.";
            submitBtn.disabled = false;
            return;
        }

        const { error, paymentIntent } = await stripe.confirmCardPayment(data.client_secret, {
            payment_method: { card: card }
        });

        if (error) {
            errorDiv.textContent = error.message;
            submitBtn.disabled = false;
        } else if (paymentIntent && paymentIntent.status === "succeeded") {
            window.location.href = `/catalogo/pago-exitoso/${data.pedido_id}/`;
        }
    });
</script>
{% endblock %}

[coverage:run]
source = .
branch = True
omit =
    */migrations/*
    tests/*
    tests/factories.py
    manage.py
    core/settings*.py
    core/wsgi.py
    core/asgi.py
    env_erp/*
    venv/*
    .venv/*
    setup.cfg
    conftest.py

[coverage:report]
fail_under = 80
show_missing = True
skip_covered = False
precision = 1

[coverage:html]
directory = htmlcov
title = ERP Django — Reporte de Cobertura

[coverage:xml]
output = coverage.xml
    // ============================================================
    // 10. BUCLE DE BATALLA DEL JEFE FINAL EN VISTA AÉREA (TOP-DOWN)
    // ============================================================
    function actualizarYRenderizarArenaTopDownN5(w, h, ahora) {
        dibujarArenaCiudadTopDownN5(w, h, ahora);

        const borde = 64;
        const jugCx = playerN5.x + jugador.tam / 2;
        const jugCy = playerN5.y + jugador.tam / 2;

        // Destello dorado de regeneración total de corazones al empezar la batalla
        if (ahora < destelloCuracionHastaN5) {
            const alfaCura = (destelloCuracionHastaN5 - ahora) / 1400;
            ctx.save();
            ctx.strokeStyle = `rgba(250, 204, 21, ${alfaCura})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(jugCx, jugCy, 34 + (1 - alfaCura) * 45, 0, Math.PI * 2);
            ctx.stroke();
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.fillStyle = `rgba(253, 224, 71, ${alfaCura})`;
            ctx.textAlign = 'center';
            ctx.fillText('+ VIDA RESTAURADA AL MÁXIMO', jugCx, jugCy - 38);
            ctx.restore();
        }

        // --- FASE DE EXPLOSIÓN DEL JEFE + CINEMÁTICA CON SOLDADOS ALIADOS -> NIVEL 6 ---
        if (explosionJefeN5 || (cinematicaAliadosN5 && cinematicaAliadosN5.activa)) {
            // 1. Renderizar explosión masiva del Jefe Final
            if (explosionJefeN5) {
                const tExp = (ahora - explosionJefeN5.inicio) / explosionJefeN5.duracion;
                if (tExp <= 1) {
                    // Onda expansiva doble
                    ctx.save();
                    ctx.strokeStyle = `rgba(244, 63, 94, ${1 - tExp})`;
                    ctx.lineWidth = 10 * (1 - tExp) + 2;
                    ctx.beginPath();
                    ctx.arc(explosionJefeN5.x, explosionJefeN5.y, tExp * 260, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.strokeStyle = `rgba(250, 204, 21, ${1 - tExp})`;
                    ctx.lineWidth = 6 * (1 - tExp) + 1;
                    ctx.beginPath();
                    ctx.arc(explosionJefeN5.x, explosionJefeN5.y, tExp * 170, 0, Math.PI * 2);
                    ctx.stroke();

                    // Núcleo brillante
                    if (tExp < 0.45) {
                        const rNuc = (1 - tExp / 0.45) * 95;
                        const nucGrad = ctx.createRadialGradient(explosionJefeN5.x, explosionJefeN5.y, 4, explosionJefeN5.x, explosionJefeN5.y, rNuc);
                        nucGrad.addColorStop(0, '#ffffff');
                        nucGrad.addColorStop(0.5, '#facc15');
                        nucGrad.addColorStop(1, 'rgba(244, 63, 94, 0)');
                        ctx.fillStyle = nucGrad;
                        ctx.beginPath();
                        ctx.arc(explosionJefeN5.x, explosionJefeN5.y, rNuc, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Fragmentos volando por toda la plaza
                    explosionJefeN5.fragmentos.forEach(fr => {
                        fr.x += fr.vx;
                        fr.y += fr.vy;
                        fr.vx *= 0.96;
                        fr.vy *= 0.96;
                        ctx.fillStyle = fr.color;
                        ctx.globalAlpha = Math.max(0, 1 - tExp);
                        ctx.beginPath();
                        ctx.arc(fr.x, fr.y, fr.radio, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                } else {
                    explosionJefeN5 = null;
                    if (cinematicaAliadosN5 && !cinematicaAliadosN5.activa) {
                        cinematicaAliadosN5.activa = true;
                        cinematicaAliadosN5.inicio = ahora;
                        document.getElementById('titulo-nivel-activo').textContent = 'NIVEL 5 — REAGRUPANDO CON LOS SOLDADOS ALIADOS...';
                    }
                }
            }

            // 2. Cinemática donde el jugador camina hacia los Soldados Aliados y pasa al Nivel 6
            if (cinematicaAliadosN5 && cinematicaAliadosN5.activa) {
                let aliadosEnPosicion = true;
                cinematicaAliadosN5.aliados.forEach(al => {
                    const dxA = al.destX - al.x;
                    const dyA = al.destY - al.y;
                    const distA = Math.hypot(dxA, dyA);
                    if (distA > 4) {
                        aliadosEnPosicion = false;
                        al.x += (dxA / distA) * 5.2;
                        al.y += (dyA / distA) * 5.2;
                    }
                });

                // Mover automáticamente al jugador hacia el comandante aliado
                const destinoJugX = w * 0.62 - jugador.tam / 2;
                const destinoJugY = h * 0.50 - jugador.tam / 2;
                const dxJ = destinoJugX - playerN5.x;
                const dyJ = destinoJugY - playerN5.y;
                const distJ = Math.hypot(dxJ, dyJ);

                if (distJ > 5) {
                    playerN5.x += (dxJ / distJ) * 4.5;
                    playerN5.y += (dyJ / distJ) * 4.5;
                    estadoMarineP2.anguloTopDown = Math.atan2(dyJ, dxJ);
                } else {
                    estadoMarineP2.anguloTopDown = 0;
                    if (cinematicaAliadosN5.reunidoEn === 0) {
                        cinematicaAliadosN5.reunidoEn = ahora;
                        textoContador = '¡NIVEL 5 COMPLETADO!';
                    }
                }

                const celebrando = (cinematicaAliadosN5.reunidoEn > 0);
                cinematicaAliadosN5.aliados.forEach(al => dibujarSoldadoAliadoTopDownN5(al, ahora, celebrando));

                if (celebrando) {
                    ctx.save();
                    ctx.font = 'bold 16px "Courier New", monospace';
                    ctx.fillStyle = '#38bdf8';
                    ctx.textAlign = 'center';
                    ctx.fillText('¡REFUERZOS ALIADOS: "BUEN TRABAJO, HERMANO. AVANCEMOS AL SECTOR 6"!', w / 2, h * 0.22);
                    ctx.restore();

                    // Tras 2.4 segundos con los aliados, iniciar automáticamente el Nivel 6
                    if (!cinematicaAliadosN5.transicionIniciada && ahora - cinematicaAliadosN5.reunidoEn >= 2400) {
                        cinematicaAliadosN5.transicionIniciada = true;
                        textoContador = '';
                        if (typeof abrirNivel === 'function') {
                            abrirNivel(6, modoExtremo);
                        }
                        return;
                    }
                }
            }

            dibujarJugadorMarineP2(playerN5.x, playerN5.y, ahora, true);

            if (textoContador !== '') {
                ctx.font = 'bold 46px "Courier New", monospace';
                ctx.fillStyle = '#ffd60a';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(textoContador, w / 2, h * 0.32);
            }
            return;
        }

        // 1. Movimiento libre del jugador en 8 direcciones por todo el mapa de la plaza
        if (puedeMoverse && jugador.vidas > 0) {
            let mx = 0;
            let my = 0;
            if (teclas.ArrowLeft || teclasExtraP2.KeyA) mx -= 1;
            if (teclas.ArrowRight || teclasExtraP2.KeyD) mx += 1;
            if (teclas.ArrowUp || teclasExtraP2.KeyW) my -= 1;
            if (teclas.ArrowDown || teclasExtraP2.KeyS) my += 1;

            if (mx !== 0 || my !== 0) {
                const norm = Math.hypot(mx, my);
                mx /= norm;
                my /= norm;
                playerN5.x += mx * 6.5;
                playerN5.y += my * 6.5;
            }

            playerN5.x = Math.max(borde, Math.min(w - borde - jugador.tam, playerN5.x));
            playerN5.y = Math.max(borde, Math.min(h - borde - jugador.tam, playerN5.y));
        }

        const nuevoJugCx = playerN5.x + jugador.tam / 2;
        const nuevoJugCy = playerN5.y + jugador.tam / 2;

        // 2. AUTO-APUNTADO INTELIGENTE:
        //    Apunta al enemigo normal más cercano si hay alguno más cerca que el jefe;
        //    de lo contrario apunta directo al Jefe Final.
        let objetivoX = null;
        let objetivoY = null;
        let distanciaMinima = Infinity;

        if (jefeFinalN5 && !jefeFinalN5.muerto) {
            const distJefe = Math.hypot(jefeFinalN5.x - nuevoJugCx, jefeFinalN5.y - nuevoJugCy);
            distanciaMinima = distJefe;
            objetivoX = jefeFinalN5.x;
            objetivoY = jefeFinalN5.y;
        }

        minionsTopDownN5.forEach(en => {
            const ex = en.x + en.tam / 2;
            const ey = en.y + en.tam / 2;
            const distEn = Math.hypot(ex - nuevoJugCx, ey - nuevoJugCy);
            if (distEn < distanciaMinima) {
                distanciaMinima = distEn;
                objetivoX = ex;
                objetivoY = ey;
            }
        });

        if (objetivoX !== null && objetivoY !== null) {
            estadoMarineP2.anguloTopDown = Math.atan2(objetivoY - nuevoJugCy, objetivoX - nuevoJugCx);
        }

        // 3. Disparo continuo directo al objetivo fijado
        if (puedeMoverse && jugador.vidas > 0) {
            if (estadoMarineP2.disparando && !estadoMarineP2.escudoActivo && ahora - estadoMarineP2.ultimoDisparo >= 105) {
                estadoMarineP2.ultimoDisparo = ahora;
                const ang = estadoMarineP2.anguloTopDown;
                estadoMarineP2.balas.push({
                    x: nuevoJugCx + Math.cos(ang) * 28,
                    y: nuevoJugCy + Math.sin(ang) * 28,
                    vx: Math.cos(ang) * 18.5,
                    vy: Math.sin(ang) * 18.5,
                    danio: 10
                });
            }

            // Refuerzos periódicos de Tiránidos normales para ayudar al jefe
            if (jefeFinalN5 && !jefeFinalN5.muerto && minionsTopDownN5.length < 4 && ahora - ultimoSpawnMinionTopDownN5 >= 5200) {
                ultimoSpawnMinionTopDownN5 = ahora;
                const lado = Math.floor(Math.random() * 4);
                let sx = w / 2, sy = h / 2;
                if (lado === 0) { sx = borde + 10; sy = borde + Math.random() * (h - borde * 2 - 60); }
                else if (lado === 1) { sx = w - borde - 70; sy = borde + Math.random() * (h - borde * 2 - 60); }
                else if (lado === 2) { sx = borde + Math.random() * (w - borde * 2 - 60); sy = borde + 10; }
                else { sx = borde + Math.random() * (w - borde * 2 - 60); sy = h - borde - 70; }
                minionsTopDownN5.push(crearEnemigoTiranidoN5(sx, sy, true));
            }
        }

        // 4. Charcos de ácido en el pavimento de la plaza
        charcosAcidoTopDownN5 = charcosAcidoTopDownN5.filter(ch => {
            if (ahora >= ch.expiraEn) return false;
            ctx.fillStyle = 'rgba(132, 204, 22, 0.55)';
            ctx.beginPath();
            ctx.arc(ch.x, ch.y, ch.radio, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a3e635';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            if (Math.hypot(nuevoJugCx - ch.x, nuevoJugCy - ch.y) < ch.radio + jugador.tam * 0.35) {
                if (!estadoMarineP2.escudoActivo) {
                    recibirDanioJugadorNivel5(1, false);
                }
            }
            return true;
        });

        // 5. Avisos de lluvia de 10 ácidos (avisan 2 segundos antes de caer)
        avisosAcidoTopDownN5 = avisosAcidoTopDownN5.filter(av => {
            const transcurrido = ahora - av.creadoEn;
            const progreso = Math.min(1, transcurrido / 2000);

            if (progreso < 1) {
                ctx.save();
                ctx.strokeStyle = '#a3e635';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(av.x, av.y, av.radio, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = `rgba(163, 230, 53, ${0.15 + progreso * 0.35})`;
                ctx.beginPath();
                ctx.arc(av.x, av.y, av.radio * progreso, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return true;
            } else {
                if (Math.hypot(nuevoJugCx - av.x, nuevoJugCy - av.y) <= av.radio + jugador.tam * 0.4) {
                    recibirDanioJugadorNivel5(1, true);
                }
                charcosAcidoTopDownN5.push({
                    x: av.x,
                    y: av.y,
                    radio: av.radio * 0.85,
                    expiraEn: ahora + 2600
                });
                return false;
            }
        });

        // 6. IA y Ataques Aleatorios del Jefe Final (3000 HP, 3x jugador, muy rápido)
        if (jefeFinalN5 && !jefeFinalN5.muerto) {
            if (puedeMoverse && jugador.vidas > 0) {
                const dx = nuevoJugCx - jefeFinalN5.x;
                const dy = nuevoJugCy - jefeFinalN5.y;
                const dist = Math.hypot(dx, dy) || 1;

                if (jefeFinalN5.estado === 'acechando') {
                    jefeFinalN5.angulo = Math.atan2(dy, dx);
                    jefeFinalN5.x += (dx / dist) * 5.6;
                    jefeFinalN5.y += (dy / dist) * 5.6;

                    if (ahora >= jefeFinalN5.proximoAtaqueEn) {
                        const eleccion = Math.random();
                        if (eleccion < 0.38) {
                            // ATAQUE 1: EMBESTIDA RELÁMPAGO CON 4 CUCHILLAS (Avisa 1 segundo antes)
                            jefeFinalN5.estado = 'aviso_embestida';
                            jefeFinalN5.inicioEstado = ahora;
                            jefeFinalN5.embestidaOrigenX = jefeFinalN5.x;
                            jefeFinalN5.embestidaOrigenY = jefeFinalN5.y;
                            const angEmb = Math.atan2(dy, dx);
                            jefeFinalN5.angulo = angEmb;
                            const distEmb = Math.min(540, Math.max(320, dist + 140));
                            jefeFinalN5.embestidaDestinoX = Math.max(borde + 55, Math.min(w - borde - 55, jefeFinalN5.x + Math.cos(angEmb) * distEmb));
                            jefeFinalN5.embestidaDestinoY = Math.max(borde + 55, Math.min(h - borde - 55, jefeFinalN5.y + Math.sin(angEmb) * distEmb));
                            jefeFinalN5.embestidaGolpeo = false;
                        } else if (eleccion < 0.70) {
                            // ATAQUE 2: LLUVIA DE 10 ÁCIDOS ALEATORIOS POR TODO EL MAPA (Avisa 2 segundos antes)
                            jefeFinalN5.estado = 'aviso_acido';
                            jefeFinalN5.inicioEstado = ahora;
                            for (let k = 0; k < 10; k++) {
                                avisosAcidoTopDownN5.push({
                                    x: borde + 45 + Math.random() * (w - borde * 2 - 90),
                                    y: borde + 45 + Math.random() * (h - borde * 2 - 90),
                                    radio: 44,
                                    creadoEn: ahora
                                });
                            }
                        } else {
                            // ATAQUE 3: BARRIDO DE COLA EN LÍNEA CURVA DE GRAN ALCANCE (Avisa 1 segundo antes)
                            jefeFinalN5.estado = 'aviso_cola';
                            jefeFinalN5.inicioEstado = ahora;
                            jefeFinalN5.colaAnguloCentro = Math.atan2(dy, dx);
                            jefeFinalN5.angulo = jefeFinalN5.colaAnguloCentro;
                            jefeFinalN5.colaGolpeo = false;
                        }
                    }
                } else if (jefeFinalN5.estado === 'aviso_embestida') {
                    if (ahora - jefeFinalN5.inicioEstado >= 1000) {
                        jefeFinalN5.estado = 'embistiendo';
                        jefeFinalN5.inicioEstado = ahora;
                    }
                } else if (jefeFinalN5.estado === 'embistiendo') {
                    const tEmb = Math.min(1, (ahora - jefeFinalN5.inicioEstado) / 260);
                    jefeFinalN5.x = jefeFinalN5.embestidaOrigenX + (jefeFinalN5.embestidaDestinoX - jefeFinalN5.embestidaOrigenX) * tEmb;
                    jefeFinalN5.y = jefeFinalN5.embestidaOrigenY + (jefeFinalN5.embestidaDestinoY - jefeFinalN5.embestidaOrigenY) * tEmb;

                    if (!jefeFinalN5.embestidaGolpeo && Math.hypot(nuevoJugCx - jefeFinalN5.x, nuevoJugCy - jefeFinalN5.y) <= jefeFinalN5.radio + jugador.tam * 0.45) {
                        jefeFinalN5.embestidaGolpeo = true;
                        recibirDanioJugadorNivel5(2, true);
                    }

                    if (tEmb >= 1) {
                        jefeFinalN5.estado = 'recuperando';
                        jefeFinalN5.inicioEstado = ahora;
                        jefeFinalN5.proximoAtaqueEn = ahora + 850;
                    }
                } else if (jefeFinalN5.estado === 'aviso_acido') {
                    if (ahora - jefeFinalN5.inicioEstado >= 450) {
                        jefeFinalN5.estado = 'acechando';
                        jefeFinalN5.proximoAtaqueEn = ahora + 1400;
                    }
                } else if (jefeFinalN5.estado === 'aviso_cola') {
                    if (ahora - jefeFinalN5.inicioEstado >= 1000) {
                        jefeFinalN5.estado = 'golpe_cola';
                        jefeFinalN5.inicioEstado = ahora;
                    }
                } else if (jefeFinalN5.estado === 'golpe_cola') {
                    const tCola = Math.min(1, (ahora - jefeFinalN5.inicioEstado) / 220);
                    const distJugJefe = Math.hypot(nuevoJugCx - jefeFinalN5.x, nuevoJugCy - jefeFinalN5.y);
                    const angJugJefe = Math.atan2(nuevoJugCy - jefeFinalN5.y, nuevoJugCx - jefeFinalN5.x);
                    let diffAng = angJugJefe - jefeFinalN5.colaAnguloCentro;
                    while (diffAng > Math.PI) diffAng -= Math.PI * 2;
                    while (diffAng < -Math.PI) diffAng += Math.PI * 2;

                    if (!jefeFinalN5.colaGolpeo && distJugJefe <= jefeFinalN5.colaAlcance && Math.abs(diffAng) <= Math.PI * 0.48) {
                        jefeFinalN5.colaGolpeo = true;
                        recibirDanioJugadorNivel5(2, true);
                    }

                    if (tCola >= 1) {
                        jefeFinalN5.estado = 'recuperando';
                        jefeFinalN5.inicioEstado = ahora;
                        jefeFinalN5.proximoAtaqueEn = ahora + 800;
                    }
                } else if (jefeFinalN5.estado === 'recuperando') {
                    if (ahora - jefeFinalN5.inicioEstado >= 350) {
                        jefeFinalN5.estado = 'acechando';
                    }
                }

                // Contacto directo con el cuerpo del jefe
                if (Math.hypot(nuevoJugCx - jefeFinalN5.x, nuevoJugCy - jefeFinalN5.y) < jefeFinalN5.radio * 0.85 + jugador.tam * 0.4) {
                    recibirDanioJugadorNivel5(1, true);
                }
            }

            // DIBUJO DE AVISOS VISUALES DEL JEFE ANTES DE GOLPEAR
            if (jefeFinalN5.estado === 'aviso_embestida') {
                const pAviso = Math.min(1, (ahora - jefeFinalN5.inicioEstado) / 1000);
                ctx.save();
                ctx.strokeStyle = `rgba(244, 63, 94, ${0.35 + pAviso * 0.6})`;
                ctx.lineWidth = jefeFinalN5.radio * 1.6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(jefeFinalN5.embestidaOrigenX, jefeFinalN5.embestidaOrigenY);
                ctx.lineTo(jefeFinalN5.embestidaDestinoX, jefeFinalN5.embestidaDestinoY);
                ctx.stroke();

                ctx.strokeStyle = '#fecdd3';
                ctx.lineWidth = 3;
                ctx.setLineDash([14, 10]);
                ctx.beginPath();
                ctx.moveTo(jefeFinalN5.embestidaOrigenX, jefeFinalN5.embestidaOrigenY);
                ctx.lineTo(jefeFinalN5.embestidaDestinoX, jefeFinalN5.embestidaDestinoY);
                ctx.stroke();
                ctx.restore();
            }

            if (jefeFinalN5.estado === 'aviso_cola' || jefeFinalN5.estado === 'golpe_cola') {
                const esGolpe = jefeFinalN5.estado === 'golpe_cola';
                const pCola = esGolpe ? 1 : Math.min(1, (ahora - jefeFinalN5.inicioEstado) / 1000);
                ctx.save();
                ctx.strokeStyle = esGolpe ? 'rgba(244, 63, 94, 0.92)' : `rgba(239, 68, 68, ${0.35 + pCola * 0.55})`;
                ctx.lineWidth = esGolpe ? 28 : (14 + pCola * 12);
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(
                    jefeFinalN5.x,
                    jefeFinalN5.y,
                    jefeFinalN5.colaAlcance * 0.85,
                    jefeFinalN5.colaAnguloCentro - Math.PI * 0.45,
                    jefeFinalN5.colaAnguloCentro + Math.PI * 0.45
                );
                ctx.stroke();
                ctx.restore();
            }

            // Dibujar al Jefe Final Von Ryan's Leaper (3x jugador, diseño aterrador)
            dibujarJefeVonRyanTopDownN5(jefeFinalN5, ahora);

            // Barra superior de vida del Jefe Final (3000 HP)
            const barW = Math.min(540, w * 0.60);
            const barX = (w - barW) / 2;
            ctx.fillStyle = 'rgba(15, 5, 25, 0.90)';
            ctx.fillRect(barX, 46, barW, 18);
            ctx.fillStyle = '#c026d3';
            ctx.fillRect(barX, 46, barW * (jefeFinalN5.vida / jefeFinalN5.vidaMax), 18);
            ctx.strokeStyle = '#f5d0fe';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(barX, 46, barW, 18);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`DEPREDADOR ALFA DE LA COLMENA: ${jefeFinalN5.vida} / ${jefeFinalN5.vidaMax}`, w / 2, 59);
        }

        // 7. Enemigos normales de apoyo en la arena top-down
        minionsTopDownN5.forEach(en => {
            if (puedeMoverse && jugador.vidas > 0) {
                const dx = nuevoJugCx - (en.x + en.tam / 2);
                const dy = nuevoJugCy - (en.y + en.tam / 2);
                const d = Math.hypot(dx, dy) || 1;
                en.vx = (dx / d) * 2.5;
                en.vy = (dy / d) * 2.5;
                en.x += en.vx;
                en.y += en.vy;

                if (en.esLanzadorAcido && d > 160 && d < 420 && ahora - en.ultimoAcido >= 2800) {
                    en.ultimoAcido = ahora;
                    avisosAcidoTopDownN5.push({
                        x: nuevoJugCx + (Math.random() - 0.5) * 40,
                        y: nuevoJugCy + (Math.random() - 0.5) * 40,
                        radio: 34,
                        creadoEn: ahora
                    });
                }

                if (d < (jugador.tam + en.tam) * 0.42) {
                    if (estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto) {
                        en.x -= en.vx * 8;
                        en.y -= en.vy * 8;
                    } else {
                        recibirDanioJugadorNivel5(1, false);
                    }
                }
            }
            dibujarEnemigoTiranidoN5(en, ahora, true);
        });

        // 8. Retícula de auto-apuntado sobre el objetivo fijado
        if (objetivoX !== null && objetivoY !== null && jugador.vidas > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.72)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(objetivoX, objetivoY, 16 + Math.sin(ahora / 100) * 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        // 9. Proyectiles del Bólter del jugador en vista aérea
        estadoMarineP2.balas = estadoMarineP2.balas.filter(b => {
            b.x += b.vx;
            b.y += b.vy;

            for (let i = 0; i < minionsTopDownN5.length; i++) {
                const en = minionsTopDownN5[i];
                if (b.x >= en.x && b.x <= en.x + en.tam && b.y >= en.y && b.y <= en.y + en.tam) {
                    en.vida -= b.danio;
                    en.flashHasta = ahora + 75;
                    if (en.vida <= 0) minionsTopDownN5.splice(i, 1);
                    return false;
                }
            }

            if (jefeFinalN5 && !jefeFinalN5.muerto &&
                Math.hypot(b.x - jefeFinalN5.x, b.y - jefeFinalN5.y) <= jefeFinalN5.radio) {
                jefeFinalN5.vida = Math.max(0, jefeFinalN5.vida - b.danio);
                jefeFinalN5.flashHasta = ahora + 65;
                if (jefeFinalN5.vida === 0) {
                    jefeFinalN5.muerto = true;
                    iniciarExplosionYCinematicaN5(jefeFinalN5.x, jefeFinalN5.y, ahora);
                }
                return false;
            }

            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
            ctx.fill();

            return b.x > borde - 10 && b.x < w - borde + 10 && b.y > borde - 10 && b.y < h - borde + 10;
        });

        // 10. Dibujar al jugador en vista aérea
        dibujarJugadorMarineP2(playerN5.x, playerN5.y, ahora, true);

        if (textoContador !== '') {
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.fillStyle = textoContador === 'GAME OVER' ? '#ff1e1e' : '#ffd60a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(textoContador, w / 2, h / 2);
        }
    }

    // ============================================================
    // 11. BUCLE PRINCIPAL DEL NIVEL 5
    // ============================================================
    function bucleNivel5() {
        if (!juegoActivo || nivelActual !== 5) return;
        const ahora = Date.now();
        const w = canvas.width;
        const h = canvas.height;
        const sueloY = h - 105;

        if (modoArenaTopDownN5) {
            actualizarYRenderizarArenaTopDownN5(w, h, ahora);
            animacionIdNivel5 = requestAnimationFrame(bucleNivel5);
            return;
        }

        if (playerN5.saliendoPortal) {
            const tSalida = ahora - playerN5.inicioSalida;
            playerN5.x = 115 + Math.min(95, (tSalida / 1400) * 95);
            if (tSalida >= 1400) {
                playerN5.saliendoPortal = false;
                puedeMoverse = true;
                document.getElementById('titulo-nivel-activo').textContent = 'NIVEL 5 — TRAMO 1: EL PUENTE EN LLAMAS';
            }
        }

        if (puedeMoverse && !playerN5.saliendoPortal) {
            if (playerN5.x >= NIVEL5_FIN_PUENTE && zonaActualTextoN5 !== 'CIUDAD') {
                zonaActualTextoN5 = 'CIUDAD';
                document.getElementById('titulo-nivel-activo').textContent = 'NIVEL 5 — TRAMO 2: AVANZANDO AL CENTRO DE LA CIUDAD';
            } else if (playerN5.x < NIVEL5_FIN_PUENTE && zonaActualTextoN5 !== 'PUENTE') {
                zonaActualTextoN5 = 'PUENTE';
                document.getElementById('titulo-nivel-activo').textContent = 'NIVEL 5 — TRAMO 1: EL PUENTE EN LLAMAS';
            }
        }

        if (puedeMoverse && jugador.vidas > 0) {
            playerN5.vx = 0;
            if (teclas.ArrowLeft || teclasExtraP2.KeyA) {
                playerN5.vx = -playerN5.vel;
                estadoMarineP2.direccion = -1;
            }
            if (teclas.ArrowRight || teclasExtraP2.KeyD) {
                playerN5.vx = playerN5.vel;
                estadoMarineP2.direccion = 1;
            }

            playerN5.x += playerN5.vx;
            playerN5.x = Math.max(20, Math.min(NIVEL5_LONGITUD - jugador.tam - 20, playerN5.x));

            if (playerN5.x >= 8650) {
                iniciarArenaJefeTopDownN5();
                animacionIdNivel5 = requestAnimationFrame(bucleNivel5);
                return;
            }

            const prevBottom = playerN5.y + jugador.tam;
            playerN5.vy += playerN5.gravedad;
            playerN5.y += playerN5.vy;
            playerN5.enSuelo = false;

            cochesDestruidosN5.forEach(coche => {
                const topCoche = sueloY - coche.alto;
                const dentroX = (playerN5.x + jugador.tam * 0.75 > coche.x) && (playerN5.x + jugador.tam * 0.25 < coche.x + coche.ancho);
                if (dentroX && playerN5.vy >= 0 && prevBottom <= topCoche + 12 && playerN5.y + jugador.tam >= topCoche) {
                    playerN5.y = topCoche - jugador.tam;
                    playerN5.vy = 0;
                    playerN5.enSuelo = true;
                }
            });

            tramosPuenteN5.forEach(tramo => {
                const dentroX = (playerN5.x + jugador.tam * 0.7 > tramo.x) && (playerN5.x + jugador.tam * 0.3 < tramo.x + tramo.ancho);
                if (dentroX && playerN5.vy >= 0 && prevBottom <= sueloY + 14 && playerN5.y + jugador.tam >= sueloY) {
                    playerN5.y = sueloY - jugador.tam;
                    playerN5.vy = 0;
                    playerN5.enSuelo = true;
                }
            });

            if (playerN5.y > h + 40) {
                estadoMarineP2.escudoActivo = false;
                recibirDanioJugadorNivel5(1, false);
                if (jugador.vidas > 0) {
                    playerN5.x = Math.max(180, playerN5.x - 190);
                    playerN5.y = sueloY - jugador.tam - 60;
                    playerN5.vy = 0;
                }
            }

            if (estadoMarineP2.disparando && !estadoMarineP2.escudoActivo && ahora - estadoMarineP2.ultimoDisparo >= 110) {
                estadoMarineP2.ultimoDisparo = ahora;
                const dir = estadoMarineP2.direccion;
                estadoMarineP2.balas.push({
                    x: playerN5.x + jugador.tam / 2 + dir * 24,
                    y: playerN5.y + jugador.tam * 0.56,
                    vx: dir * 16.5,
                    vy: 0,
                    danio: 10
                });
            }

            if (playerN5.x < 8400 && enemigosN5.length < 9 && ahora - ultimoSpawnHordaN5 >= 2200) {
                ultimoSpawnHordaN5 = ahora;
                const spawnX = playerN5.x + w * 0.68;
                if (spawnX < 8500 && haySueloEnX_N5(spawnX, 62)) {
                    enemigosN5.push(crearEnemigoTiranidoN5(spawnX, sueloY - 62, Math.random() > 0.45));
                }
            }

            if (playerN5.x >= 4400 && playerN5.x < 8300 && guardianesEliteN5.length < 2 && ahora - ultimoSpawnEliteN5 >= 9500) {
                ultimoSpawnEliteN5 = ahora;
                const spawnEliteX = playerN5.x + w * 0.72;
                if (spawnEliteX < 8400 && haySueloEnX_N5(spawnEliteX, 112)) {
                    guardianesEliteN5.push(crearGuardianEliteN5(spawnEliteX, sueloY - 104));
                }
            }
        }

        const targetCamX = Math.max(0, Math.min(NIVEL5_LONGITUD - w, playerN5.x - w * 0.30));
        camaraX_N5 += (targetCamX - camaraX_N5) * 0.14;

        dibujarFondoGuerraN5(w, h, sueloY, ahora);
        dibujarPuenteYCochesN5(w, h, sueloY, ahora);

        if (portalInicioN5) {
            const px = portalInicioN5.x - camaraX_N5;
            if (px > -120 && px < w + 120) {
                ctx.save();
                const giro = ahora / 300;
                const pGrad = ctx.createRadialGradient(px, portalInicioN5.y, 6, px, portalInicioN5.y, portalInicioN5.radio);
                pGrad.addColorStop(0, '#ffffff');
                pGrad.addColorStop(0.45, '#c084fc');
                pGrad.addColorStop(0.85, '#6b21a8');
                pGrad.addColorStop(1, 'rgba(88, 28, 135, 0)');
                ctx.fillStyle = pGrad;
                ctx.beginPath();
                ctx.ellipse(px, portalInicioN5.y, portalInicioN5.radio * 0.62, portalInicioN5.radio * 1.15, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#f3e8ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(px, portalInicioN5.y, portalInicioN5.radio * 0.45, portalInicioN5.radio * 0.95, Math.sin(giro) * 0.1, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        enemigosN5.forEach(en => {
            if (puedeMoverse && jugador.vidas > 0) {
                const distJugador = playerN5.x - en.x;
                const absDist = Math.abs(distJugador);
                if (absDist < w * 0.85) {
                    const dirMov = Math.sign(distJugador || -1);

                    if (en.esLanzadorAcido && absDist > 170 && absDist < 450) {
                        en.vx = dirMov * 0.01;
                        if (ahora - en.ultimoAcido >= 2400) {
                            en.ultimoAcido = ahora;
                            en.animEscupirHasta = ahora + 300;
                            const tiempoVuelo = Math.max(28, Math.min(48, absDist / 8.5));
                            const vxAcido = distJugador / tiempoVuelo;
                            const vyAcido = -0.5 * 0.45 * tiempoVuelo + ((playerN5.y - en.y) / tiempoVuelo);
                            proyectilesAcidoN5.push({
                                x: en.x + en.tam / 2 + dirMov * 18,
                                y: en.y + 14,
                                vx: vxAcido,
                                vy: vyAcido,
                                radio: 7
                            });
                        }
                    } else {
                        const velBase = en.esLanzadorAcido ? 1.9 : 2.8;
                        const nextX = en.x + dirMov * velBase;
                        if (haySueloEnX_N5(nextX, en.tam)) {
                            en.x = nextX;
                            en.vx = dirMov * velBase;
                        }
                        const chocaCoche = cochesDestruidosN5.some(c =>
                            (en.x + en.tam > c.x - 6) && (en.x < c.x + c.ancho + 6) && (en.y + en.tam > sueloY - c.alto + 8)
                        );
                        if (chocaCoche && en.enSuelo) {
                            en.vy = -12.5;
                            en.enSuelo = false;
                        }
                    }
                }

                const prevEnBottom = en.y + en.tam;
                en.vy += 0.72;
                en.y += en.vy;
                en.enSuelo = false;

                cochesDestruidosN5.forEach(coche => {
                    const topCoche = sueloY - coche.alto;
                    const dentroX = (en.x + en.tam * 0.75 > coche.x) && (en.x + en.tam * 0.25 < coche.x + coche.ancho);
                    if (dentroX && en.vy >= 0 && prevEnBottom <= topCoche + 12 && en.y + en.tam >= topCoche) {
                        en.y = topCoche - en.tam;
                        en.vy = 0;
                        en.enSuelo = true;
                    }
                });

                tramosPuenteN5.forEach(tramo => {
                    const dentroX = (en.x + en.tam * 0.7 > tramo.x) && (en.x + en.tam * 0.3 < tramo.x + tramo.ancho);
                    if (dentroX && en.vy >= 0 && prevEnBottom <= sueloY + 14 && en.y + en.tam >= sueloY) {
                        en.y = sueloY - en.tam;
                        en.vy = 0;
                        en.enSuelo = true;
                    }
                });

                const toca = Math.abs((en.x + en.tam / 2) - (playerN5.x + jugador.tam / 2)) < (jugador.tam + en.tam) * 0.36 &&
                             Math.abs((en.y + en.tam / 2) - (playerN5.y + jugador.tam / 2)) < (jugador.tam + en.tam) * 0.42;
                if (toca) {
                    if (estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto) {
                        en.x += (en.x >= playerN5.x ? 30 : -30);
                    } else {
                        recibirDanioJugadorNivel5(1, false);
                    }
                }
            }
            if (en.x - camaraX_N5 > -100 && en.x - camaraX_N5 < w + 100) {
                dibujarEnemigoTiranidoN5(en, ahora, false);
            }
        });

        proyectilesAcidoN5 = proyectilesAcidoN5.filter(ac => {
            ac.vy += 0.45;
            ac.x += ac.vx;
            ac.y += ac.vy;

            const axScreen = ac.x - camaraX_N5;
            const jugCx = playerN5.x + jugador.tam / 2;
            const jugCy = playerN5.y + jugador.tam / 2;

            if (Math.hypot(ac.x - jugCx, ac.y - jugCy) <= jugador.tam * 0.62 + ac.radio) {
                if (estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto) {
                    ctx.fillStyle = '#bef264';
                    ctx.beginPath();
                    ctx.arc(axScreen, ac.y, 16, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    recibirDanioJugadorNivel5(1, false);
                }
                return false;
            }

            if (ac.y >= sueloY - 4) {
                if (haySueloEnX_N5(ac.x - 15, 30)) {
                    charcosAcidoN5.push({
                        x: ac.x - 18,
                        y: sueloY - 4,
                        ancho: 36,
                        expiraEn: ahora + 2200
                    });
                }
                return false;
            }

            ctx.save();
            ctx.fillStyle = 'rgba(132, 204, 22, 0.45)';
            ctx.beginPath();
            ctx.arc(axScreen - ac.vx * 1.2, ac.y - ac.vy * 1.2, ac.radio * 0.75, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#a3e635';
            ctx.strokeStyle = '#365314';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(axScreen, ac.y, ac.radio, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            return ac.y < h + 40;
        });

        charcosAcidoN5 = charcosAcidoN5.filter(ch => {
            if (ahora >= ch.expiraEn) return false;
            const cxScreen = ch.x - camaraX_N5;
            ctx.fillStyle = 'rgba(163, 230, 53, 0.8)';
            ctx.beginPath();
            ctx.roundRect(cxScreen, ch.y, ch.ancho, 5, 3);
            ctx.fill();

            const pisaCharco = (playerN5.x + jugador.tam * 0.7 > ch.x) &&
                               (playerN5.x + jugador.tam * 0.3 < ch.x + ch.ancho) &&
                               (playerN5.y + jugador.tam >= sueloY - 6);
            if (pisaCharco && (!estadoMarineP2.escudoActivo || estadoMarineP2.escudoRoto)) {
                recibirDanioJugadorNivel5(1, false);
            }
            return true;
        });

        guardianesEliteN5.forEach(g => {
            if (puedeMoverse && jugador.vidas > 0) {
                const centroJugX = playerN5.x + jugador.tam / 2;
                const centroGX = g.x + g.ancho / 2;
                const distX = centroJugX - centroGX;
                const absDistX = Math.abs(distX);

                if (absDistX < w * 0.95) {
                    const dirMov = Math.sign(distX || -1);

                    if (g.estadoAtaque === 'caminando') {
                        g.vx = dirMov * Math.abs(g.vx);
                        if (absDistX <= 96) {
                            g.estadoAtaque = 'preparando';
                            g.inicioAtaque = ahora;
                            g.golpeAplicadoEnEsteTajo = false;
                        } else {
                            const nextX = g.x + g.vx;
                            if (haySueloEnX_N5(nextX, g.ancho)) {
                                g.x = nextX;
                            }
                            const chocaCoche = cochesDestruidosN5.some(c =>
                                (g.x + g.ancho > c.x - 4) && (g.x < c.x + c.ancho + 4) && (g.y + g.alto > sueloY - c.alto + 6)
                            );
                            if (chocaCoche && g.enSuelo) {
                                g.vy = -10.5;
                                g.enSuelo = false;
                            }
                        }
                    } else if (g.estadoAtaque === 'preparando') {
                        if (ahora - g.inicioAtaque >= 420) {
                            g.estadoAtaque = 'tajando';
                            g.inicioAtaque = ahora;
                        }
                    } else if (g.estadoAtaque === 'tajando') {
                        if (!g.golpeAplicadoEnEsteTajo && absDistX <= 122 && Math.abs((g.y + g.alto * 0.6) - (playerN5.y + jugador.tam / 2)) < 75) {
                            g.golpeAplicadoEnEsteTajo = true;
                            if (estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto) {
                                playerN5.x += dirMov * 22;
                            } else {
                                recibirDanioJugadorNivel5(2, false);
                            }
                        }
                        if (ahora - g.inicioAtaque >= 240) {
                            g.estadoAtaque = 'recuperando';
                            g.inicioAtaque = ahora;
                        }
                    } else if (g.estadoAtaque === 'recuperando') {
                        if (ahora - g.inicioAtaque >= 380) {
                            g.estadoAtaque = 'caminando';
                        }
                    }
                }

                const prevGBottom = g.y + g.alto;
                g.vy += 0.95;
                g.y += g.vy;
                g.enSuelo = false;

                cochesDestruidosN5.forEach(coche => {
                    const topCoche = sueloY - coche.alto;
                    const dentroX = (g.x + g.ancho * 0.72 > coche.x) && (g.x + g.ancho * 0.28 < coche.x + coche.ancho);
                    if (dentroX && g.vy >= 0 && prevGBottom <= topCoche + 14 && g.y + g.alto >= topCoche) {
                        g.y = topCoche - g.alto;
                        g.vy = 0;
                        g.enSuelo = true;
                    }
                });

                tramosPuenteN5.forEach(tramo => {
                    const dentroX = (g.x + g.ancho * 0.7 > tramo.x) && (g.x + g.ancho * 0.3 < tramo.x + tramo.ancho);
                    if (dentroX && g.vy >= 0 && prevGBottom <= sueloY + 14 && g.y + g.alto >= sueloY) {
                        g.y = sueloY - g.alto;
                        g.vy = 0;
                        g.enSuelo = true;
                    }
                });
            }

            if (g.x - camaraX_N5 > -180 && g.x - camaraX_N5 < w + 180) {
                dibujarGuardianEliteN5(g, ahora);
            }
        });

        estadoMarineP2.balas = estadoMarineP2.balas.filter(b => {
            b.x += b.vx;
            const bxScreen = b.x - camaraX_N5;

            for (let i = 0; i < enemigosN5.length; i++) {
                const en = enemigosN5[i];
                if (b.x >= en.x && b.x <= en.x + en.tam && b.y >= en.y && b.y <= en.y + en.tam) {
                    en.vida -= b.danio;
                    en.flashHasta = ahora + 75;
                    if (en.vida <= 0) enemigosN5.splice(i, 1);
                    return false;
                }
            }

            for (let i = 0; i < guardianesEliteN5.length; i++) {
                const g = guardianesEliteN5[i];
                if (b.x >= g.x && b.x <= g.x + g.ancho && b.y >= g.y && b.y <= g.y + g.alto) {
                    g.vida -= b.danio;
                    g.flashHasta = ahora + 70;
                    if (g.vida <= 0) guardianesEliteN5.splice(i, 1);
                    return false;
                }
            }

            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(bxScreen - 9, b.y - 2.5, 18, 5);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bxScreen - 5, b.y - 1, 10, 2);

            return bxScreen > -40 && bxScreen < w + 40;
        });

        dibujarJugadorMarineP2(playerN5.x - camaraX_N5, playerN5.y, ahora, false);

        const prog = Math.min(1, Math.max(0, playerN5.x / 8650));
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillRect(24, 52, 260, 10);
        ctx.fillStyle = playerN5.x >= NIVEL5_FIN_PUENTE ? '#f97316' : '#c084fc';
        ctx.fillRect(24, 52, 260 * prog, 10);
        const marcaCiudadX = 24 + 260 * (NIVEL5_FIN_PUENTE / 8650);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(marcaCiudadX - 1, 49, 2, 16);
        ctx.strokeStyle = '#94a3b8';
        ctx.strokeRect(24, 52, 260, 10);

        if (textoContador !== '') {
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.fillStyle = textoContador === 'GAME OVER' ? '#ff1e1e' : '#ffd60a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(textoContador, w / 2, h / 2);
        }

        animacionIdNivel5 = requestAnimationFrame(bucleNivel5);
    }

    inicializarUIParte2();
</script>

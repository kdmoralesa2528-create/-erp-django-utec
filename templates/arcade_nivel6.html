<script>
    let animacionIdNivel6 = null;
    let estadoNivel6 = null;

    // Control exclusivo del Nivel 6: Tecla [B] para curar escuadrón y al jugador con botiquín
    window.addEventListener('keydown', e => {
        if (!juegoActivo || nivelActual !== 6 || !estadoNivel6) return;

        if (e.code === 'KeyB' && !e.repeat) {
            e.preventDefault();
            usarBotiquinEscuadronN6();
        }
    }, true);

    function usarBotiquinEscuadronN6() {
        if (!estadoNivel6 || estadoNivel6.fase !== 'combate') return;
        if (estadoNivel6.botiquines <= 0) {
            estadoNivel6.mensajeAlerta = '⚠️ NO TIENES BOTIQUINES GUARDADOS';
            estadoNivel6.mensajeAlertaHasta = Date.now() + 1400;
            return;
        }

        const ahora = Date.now();
        estadoNivel6.botiquines--;

        let curados = 0;
        estadoNivel6.aliados.forEach(al => {
            if (al.vivo && al.vidas < al.vidasMax) {
                al.vidas++;
                al.destelloCuraHasta = ahora + 900;
                curados++;
            }
        });

        if (jugador.vidas < jugador.vidasMax) {
            jugador.vidas = Math.min(jugador.vidasMax, jugador.vidas + 1);
            actualizarCorazonesUI();
            curados++;
        }

        estadoNivel6.destelloCuraJugadorHasta = ahora + 900;
        estadoNivel6.mensajeAlerta = curados > 0
            ? `✚ BOTIQUÍN USADO: +1 CORAZÓN A TI Y AL EQUIPO (${estadoNivel6.botiquines} RESTANTES)`
            : `✚ TODOS AL MÁXIMO DE VIDA (${estadoNivel6.botiquines} BOTIQUINES)`;
        estadoNivel6.mensajeAlertaHasta = ahora + 1800;
        actualizarHudNivel6();
    }

    function actualizarHudNivel6() {
        const hudEnergia = document.getElementById('cargas-energia');
        const hudDerecha = document.querySelector('.hud-juego span:last-child');
        if (!estadoNivel6) return;

        const vivos = estadoNivel6.aliados.filter(a => a.vivo).length;

        if (hudDerecha && nivelActual === 6) {
            hudDerecha.textContent = '[WASD / FLECHAS] MOVER | [ESPACIO] DISPARAR | [E] ESCUDO | [B] BOTIQUÍN';
            hudDerecha.style.color = '#cbd5e1';
        }

        if (hudEnergia && nivelActual === 6) {
            const txtEscudo = estadoMarineP2.escudoRoto
                ? '💥 SIN ESCUDO'
                : (estadoMarineP2.escudoActivo ? '🛡️ ESCUDO ACTIVO' : `🛡️ [E] (${estadoMarineP2.escudoGolpesRestantes}/3)`);
            const txtArma = estadoNivel6.tieneAmetralladora ? '🔥 AMETRALLADORA (20/s)' : '🔫 BÓLTER';
            hudEnergia.textContent = `🪖 ALIADOS: ${vivos}/10 | ✚ [B]: ${estadoNivel6.botiquines} | ${txtArma} | ${txtEscudo}`;
            hudEnergia.style.color = estadoNivel6.tieneAmetralladora ? '#facc15' : '#38bdf8';
        }
    }

    // ============================================================
    // 1. INICIALIZACIÓN DEL NIVEL 6
    // ============================================================
    function iniciarNivel6() {
        cancelAnimationFrame(animacionIdNivel6);
        clearInterval(intervaloContador);
        textoContador = '';
        activarPantallaCompletaParte2();

        const w = canvas.width;
        const h = canvas.height;
        const ahora = Date.now();

        jugador.tam = 42;
        jugador.vidasMax = 10;
        jugador.vidas = 10;
        jugador.invulnerableHasta = 0;
        actualizarCorazonesUI();

        estadoMarineP2.escudoActivo = false;
        estadoMarineP2.escudoGolpesRestantes = 3;
        estadoMarineP2.escudoRoto = false;
        estadoMarineP2.disparando = false;
        estadoMarineP2.anguloTopDown = -Math.PI / 2;
        estadoMarineP2.balas = [];
        estadoMarineP2.particulas = [];

        const anchoEdificio = Math.max(85, Math.min(135, w * 0.085));

        const aliados = [];
        const offsetsFormacion = [
            { dx: -125, dy: -45 }, { dx: -75, dy: -62 }, { dx: 75, dy: -62 }, { dx: 125, dy: -45 },
            { dx: -140, dy: 20 },  { dx: -85, dy: 28 },  { dx: 85, dy: 28 },  { dx: 140, dy: 20 },
            { dx: -52,  dy: 72 },  { dx: 52,  dy: 72 }
        ];

        offsetsFormacion.forEach((off, idx) => {
            aliados.push({
                id: idx + 1,
                esComandante: idx === 1,
                x: w / 2 + off.dx,
                y: h * 0.68 + off.dy,
                tam: 26,
                vidas: 3,
                vidasMax: 3,
                vivo: true,
                angulo: -Math.PI / 2,
                ultimoDisparo: ahora + (idx * 33),
                invulnerableHasta: 0,
                destelloCuraHasta: 0,
                dashVx: 0,
                dashVy: 0,
                ultimoEsquive: 0,
                offsetX: off.dx * 1.15,
                offsetY: off.dy * 0.9
            });
        });

        const edificiosLaterales = [];
        for (let ey = -200; ey < h + 240; ey += 180) {
            edificiosLaterales.push({
                y: ey,
                alto: 168,
                enLlamasIzq: (Math.abs(ey) % 360 === 0),
                enLlamasDer: (Math.abs(ey + 180) % 360 === 0)
            });
        }

        const cochesAvenida = [
            { x: anchoEdificio + 75, y: h * 0.24, ancho: 40, alto: 72, color: '#475569', enLlamas: true },
            { x: w - anchoEdificio - 115, y: h * 0.48, ancho: 42, alto: 76, color: '#7f1d1d', enLlamas: false },
            { x: anchoEdificio + 110, y: h * 0.78, ancho: 40, alto: 72, color: '#3f6212', enLlamas: true }
        ];

        estadoNivel6 = {
            fase: 'dialogo',
            pasoDialogo: 0,
            inicioPasoDialogo: ahora,
            anchoEdificio: anchoEdificio,
            scrollCalleY: 0,
            velAvanceCalle: 0,
            playerX: w / 2 - jugador.tam / 2,
            playerY: h * 0.68 - jugador.tam / 2,
            destelloCuraJugadorHasta: 0,
            aliados: aliados,
            enemigosNormales: [],
            guardianesElites: [],
            jefesAlfa: [],
            jefeFinalDreadnought: null,
            jefeFinalInvocado: false, // Solo se invoca cuando las 15 hordas y TODOS los enemigos hayan muerto
            proyectilesDreadnought: [],
            avisosMisilesDreadnought: [],
            ondasChoqueDreadnought: [],
            avisosAcidoJefes: [],
            balasAliados: [],
            proyectilesAcido: [],
            charcosAcido: [],
            botiquinesCampo: [],
            cofreArma: null,
            tieneAmetralladora: false,
            botiquines: 1,
            oleadaActual: 0,
            totalOleadas: 15, // 15 Hordas de oleadas + Ronda Final 16 exclusiva del Jefe Final
            proximaOleadaEn: 0,
            pendientesNormales: 0,
            pendientesElites: 0,
            ultimoGoteoSpawn: 0,
            ultimoSpawnBotiquin: ahora,
            edificiosLaterales: edificiosLaterales,
            cochesAvenida: cochesAvenida,
            mensajeAlerta: '',
            mensajeAlertaHasta: 0,
            victoriaEn: 0
        };

        puedeMoverse = false;
        document.getElementById('titulo-nivel-activo').textContent = 'NIVEL 6 — ENCUENTRO CON LA GUARDIA DE LA CIUDAD';
        actualizarHudNivel6();
        bucleNivel6();
    }

    // ============================================================
    // 2. CREACIÓN DE DEPREDADOR ALFA (3,000 HP) Y JEFE FINAL DREADNOUGHT (50,000 HP)
    // ============================================================
    function crearDepredadorAlfaN6(x, y, ahora) {
        const tamJefe = 96;
        return {
            x: x,
            y: y,
            tam: tamJefe,
            radio: tamJefe * 0.46,
            angulo: Math.PI / 2,
            vida: 3000,
            vidaMax: 3000,
            flashHasta: 0,
            estado: 'acechando',
            inicioEstado: ahora,
            proximoAtaqueEn: ahora + 1400 + Math.random() * 900,
            embestidaOrigenX: 0,
            embestidaOrigenY: 0,
            embestidaDestinoX: 0,
            embestidaDestinoY: 0,
            embestidaGolpeo: false,
            colaAnguloCentro: 0,
            colaAlcance: 175,
            colaGolpeo: false
        };
    }

    function crearJefeFinalDreadnoughtN6(w, ahora) {
        // 5 veces más grande que el jugador (jugador.tam = 42 -> 210px)
        const tamDread = jugador.tam * 5;
        return {
            x: w / 2,
            y: -120, // Entra imponiéndose desde el frente de la base enemiga
            tam: tamDread,
            radio: tamDread * 0.42,
            angulo: Math.PI / 2,
            vida: 50000,
            vidaMax: 50000,
            flashHasta: 0,
            estado: 'marchando',
            inicioEstado: ahora,
            proximoAtaqueEn: ahora + 1700,
            embestidaOrigenX: 0,
            embestidaOrigenY: 0,
            embestidaDestinoX: 0,
            embestidaDestinoY: 0,
            embestidaGolpeo: false,
            ultimoDisparoRotativo: 0,
            rafagasDisparadas: 0,
            laserAnguloInicio: 0,
            laserAnguloActual: 0,
            laserGolpeoJugador: false,
            latigosGolpeoJugador: false
        };
    }

    // ============================================================
    // 3. GENERACIÓN DE HORDAS (15 HORDAS CADA 15 SEGUNDOS)
    // ============================================================
    function iniciarSiguienteOleadaN6(ahora) {
        if (!estadoNivel6) return;
        const w = canvas.width;
        const h = canvas.height;
        const anchoEd = estadoNivel6.anchoEdificio;

        estadoNivel6.oleadaActual++;
        const n = estadoNivel6.oleadaActual;

        estadoNivel6.pendientesNormales = 30;
        estadoNivel6.pendientesElites = 5;
        estadoNivel6.proximaOleadaEn = ahora + 15000;
        estadoNivel6.ultimoGoteoSpawn = 0;

        let textoExtra = '';

        // HORDA 7: Cofre con Ametralladora Pesada
        if (n === 7) {
            estadoNivel6.cofreArma = {
                x: w / 2,
                y: h * 0.34,
                ancho: 46,
                alto: 34,
                creadoEn: ahora
            };
            textoExtra = ' — ¡COFRE DE ARMAMENTO PESADO EN LA AVENIDA!';
        }

        // HORDAS 9 a 12: 1 Depredador Alfa (3,000 HP)
        if (n >= 9 && n <= 12) {
            const jx = anchoEd + 110 + Math.random() * Math.max(120, w - anchoEd * 2 - 220);
            estadoNivel6.jefesAlfa.push(crearDepredadorAlfaN6(jx, 85, ahora));
            textoExtra = ' — ¡DEPREDADOR ALFA (3,000 HP) HA LLEGADO!';
        }

        // HORDAS 13 a 15: 3 Depredadores Alfa (3,000 HP cada uno)
        if (n >= 13 && n <= 15) {
            const anchoUtil = w - anchoEd * 2;
            const posicionesX = [
                anchoEd + anchoUtil * 0.22,
                anchoEd + anchoUtil * 0.50,
                anchoEd + anchoUtil * 0.78
            ];
            posicionesX.forEach((px, idx) => {
                estadoNivel6.jefesAlfa.push(crearDepredadorAlfaN6(px, 85 + (idx % 2) * 30, ahora + idx * 250));
            });
            textoExtra = ' — ¡ALERTA MÁXIMA: 3 DEPREDADORES ALFA (3,000 HP C/U)!';
        }

        estadoNivel6.mensajeAlerta = `⚠️ HORDA ${n}/${estadoNivel6.totalOleadas}${textoExtra}`;
        estadoNivel6.mensajeAlertaHasta = ahora + 3200;
        document.getElementById('titulo-nivel-activo').textContent =
            `NIVEL 6 — HORDA ${n}/${estadoNivel6.totalOleadas} (MARCHA AL FRENTE ENEMIGO)`;
    }

    function generarEnemigosPendientesN6(w, h, ahora) {
        if (!estadoNivel6) return;
        const minX = estadoNivel6.anchoEdificio + 24;
        const maxX = w - estadoNivel6.anchoEdificio - 65;

        if (ahora - estadoNivel6.ultimoGoteoSpawn < 220) return;
        estadoNivel6.ultimoGoteoSpawn = ahora;

        const loteNormales = Math.min(6, estadoNivel6.pendientesNormales);
        for (let i = 0; i < loteNormales; i++) {
            estadoNivel6.pendientesNormales--;
            const esAcido = (estadoNivel6.pendientesNormales % 5 === 0);
            estadoNivel6.enemigosNormales.push({
                x: minX + Math.random() * Math.max(60, maxX - minX),
                y: -40 - Math.random() * 140,
                tam: 31,
                vx: 0,
                vy: 2.3,
                vida: 30,
                vidaMax: 30,
                flashHasta: 0,
                pasoAnim: Math.random() * 10,
                esLanzadorAcido: esAcido,
                ultimoAcido: ahora + 900 + Math.random() * 1200
            });
        }

        if (estadoNivel6.pendientesElites > 0) {
            estadoNivel6.pendientesElites--;
            estadoNivel6.guardianesElites.push({
                x: minX + Math.random() * Math.max(80, maxX - minX - 25),
                y: -80 - Math.random() * 90,
                tam: 60,
                angulo: Math.PI / 2,
                vida: 180,
                vidaMax: 180,
                flashHasta: 0,
                estadoAtaque: 'caminando',
                inicioAtaque: 0,
                golpeAplicado: false
            });
        }
    }

    // ============================================================
    // 4. DIBUJO DEL JEFE FINAL: DREADNOUGHT REDEMPTOR ALTAMENTE INFECTADO
    // ============================================================
    function dibujarDreadnoughtInfectadoTopDownN6(dread, ahora) {
        const golpeado = ahora < dread.flashHasta;
        const R = dread.radio; // 5 veces el tamaño del jugador

        ctx.save();
        ctx.translate(dread.x, dread.y);

        // Sombra colosal
        ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
        ctx.beginPath();
        ctx.ellipse(10, 14, R * 1.24, R * 1.12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Aura bio-tóxica y psíquica tiránida envolviendo al caminante
        const aura = ctx.createRadialGradient(0, 0, R * 0.35, 0, 0, R * 1.65);
        aura.addColorStop(0, 'rgba(168, 85, 247, 0.38)');
        aura.addColorStop(0.55, 'rgba(132, 204, 22, 0.16)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, R * 1.65, 0, Math.PI * 2);
        ctx.fill();

        // --- HABILIDAD DE LÁTIGOS DE TENTÁCULOS BIOLÓGICOS (SI ESTÁ ACTIVA) ---
        if (dread.estado === 'latigos') {
            const progLat = Math.min(1, (ahora - dread.inicioEstado) / 550);
            const alcanceLat = R * (1.1 + Math.sin(progLat * Math.PI) * 1.15);
            for (let l = 0; l < 6; l++) {
                const angL = (Math.PI * 2 / 6) * l + progLat * 1.4;
                ctx.strokeStyle = '#9333ea';
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(
                    Math.cos(angL + 0.4) * alcanceLat * 0.6,
                    Math.sin(angL + 0.4) * alcanceLat * 0.6,
                    Math.cos(angL) * alcanceLat,
                    Math.sin(angL) * alcanceLat
                );
                ctx.stroke();

                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        ctx.rotate(dread.angulo);

        // --- PIERNAS BLINDADAS CON TENDONES TIRÁNIDOS ---
        const pasoPierna = Math.sin(ahora / 170) * 14;
        [-1, 1].forEach(lado => {
            const px = lado === -1 ? pasoPierna : -pasoPierna;
            const py = lado * R * 0.58;
            ctx.fillStyle = golpeado ? '#ffffff' : '#1e3a8a';
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.roundRect(px - 24, py - 15, 48, 30, 6);
            ctx.fill();
            ctx.stroke();

            // Espolón quitinoso morado brotando de cada rodilla
            ctx.fillStyle = golpeado ? '#ffffff' : '#6b21a8';
            ctx.beginPath();
            ctx.moveTo(px + 12, py - 8);
            ctx.lineTo(px + 34, py + lado * 12);
            ctx.lineTo(px + 12, py + 8);
            ctx.closePath();
            ctx.fill();
        });

        // --- BRAZO DERECHO (+Y): MACRO-INCINERADOR DE PLASMA MUTADO ---
        ctx.save();
        ctx.translate(R * 0.14, R * 0.90);
        ctx.fillStyle = golpeado ? '#ffffff' : '#18181b';
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.roundRect(-24, -17, R * 1.28, 36, 6);
        ctx.fill();
        ctx.stroke();

        // Bobinas de plasma cian infectadas con venas verdes ácidas
        const pulsoPlasma = 0.78 + Math.sin(ahora / 75) * 0.22;
        ctx.fillStyle = `rgba(56, 189, 248, ${pulsoPlasma})`;
        ctx.fillRect(10, -11, R * 0.70, 24);
        ctx.strokeStyle = '#84cc16';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(8, -12);
        ctx.quadraticCurveTo(R * 0.45, 16, R * 0.78, -6);
        ctx.stroke();

        // Garras orgánicas abrazando el cañón de plasma
        ctx.fillStyle = golpeado ? '#ffffff' : '#581c87';
        ctx.beginPath();
        ctx.moveTo(R * 0.35, 18);
        ctx.lineTo(R * 0.88, 28);
        ctx.lineTo(R * 0.72, 12);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#334155';
        ctx.fillRect(R * 0.98, -14, 18, 30);
        ctx.restore();

        // --- BRAZO IZQUIERDO (-Y): PUÑO REDEMPTOR + TRIPLE GARRA GUADAÑA TIRÁNIDA ---
        ctx.save();
        ctx.translate(R * 0.16, -R * 0.90);
        ctx.fillStyle = '#27272a';
        ctx.strokeStyle = '#a1a1aa';
        ctx.lineWidth = 1.8;
        ctx.fillRect(12, 6, R * 0.75, 14);
        ctx.strokeRect(12, 6, R * 0.75, 14);

        ctx.fillStyle = golpeado ? '#ffffff' : '#1d4ed8';
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.roundRect(-18, -22, R * 0.80, 36, 7);
        ctx.fill();
        ctx.stroke();

        // Masa biológica morada envolviendo el puño
        ctx.fillStyle = golpeado ? '#ffffff' : '#4c1d95';
        ctx.beginPath();
        ctx.arc(R * 0.25, -8, 22, 0, Math.PI * 2);
        ctx.fill();

        // 3 enormes garras guadaña carmesí serradas mutadas
        [-18, -4, 10].forEach((offsetG, idxG) => {
            ctx.fillStyle = golpeado ? '#ffffff' : '#9f1239';
            ctx.strokeStyle = '#fda4af';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(R * 0.35, offsetG);
            ctx.quadraticCurveTo(R * 1.18, offsetG - 14 + idxG * 5, R * 1.52, offsetG + 8);
            ctx.lineTo(R * 0.86, offsetG + 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        });
        ctx.restore();

        // --- HOMBRERAS DE ULTRAMARINES CORROMPIDAS ---
        // Hombrera Derecha (+Y): Azul con símbolo Omega blanco (Ω) + Espinas moradas
        ctx.fillStyle = golpeado ? '#ffffff' : '#1e40af';
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(-R * 0.44, R * 0.52, R * 0.92, R * 0.50, 10);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.arc(0, R * 0.76, 11, Math.PI * 0.75, Math.PI * 2.25);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-12, R * 0.76 + 8);
        ctx.lineTo(-6, R * 0.76 + 8);
        ctx.moveTo(6, R * 0.76 + 8);
        ctx.lineTo(12, R * 0.76 + 8);
        ctx.stroke();

        // Pústulas ácidas brillantes sobre la hombrera derecha
        ctx.fillStyle = '#84cc16';
        ctx.beginPath();
        ctx.arc(-R * 0.22, R * 0.68, 7, 0, Math.PI * 2);
        ctx.arc(-R * 0.14, R * 0.86, 5, 0, Math.PI * 2);
        ctx.fill();

        // Hombrera Izquierda (-Y): Totalmente cubierta por caparazón quitinoso tiránido morado
        ctx.fillStyle = golpeado ? '#ffffff' : '#4c1d95';
        ctx.strokeStyle = '#d8b4fe';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-R * 0.54, -R * 0.96);
        ctx.lineTo(R * 0.22, -R * 1.24);
        ctx.lineTo(R * 0.52, -R * 0.84);
        ctx.lineTo(R * 0.18, -R * 0.50);
        ctx.lineTo(-R * 0.46, -R * 0.55);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Insignia amarilla "II" medio devorada por la infección
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(8, -R * 0.74, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#09090b';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('II', 8, -R * 0.70);

        // --- TORSO CENTRAL BLINDADO + CRECIMIENTO ORGÁNICO TIRÁNIDO ---
        ctx.fillStyle = golpeado ? '#ffffff' : '#1d4ed8';
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-R * 0.64, -R * 0.58, R * 1.32, R * 1.16, 12);
        ctx.fill();
        ctx.stroke();

        // Placa frontal con Águila Dorada partida por grietas de biomasa morada
        ctx.fillStyle = golpeado ? '#ffffff' : '#2563eb';
        ctx.beginPath();
        ctx.roundRect(R * 0.10, -R * 0.38, R * 0.58, R * 0.76, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(R * 0.45, -24);
        ctx.lineTo(R * 0.56, 0);
        ctx.lineTo(R * 0.45, 24);
        ctx.lineTo(R * 0.36, 0);
        ctx.closePath();
        ctx.fill();

        // Visor del sarcófago mutado con ojos múltiples tiránidos amarillos y rojo sangre
        ctx.fillStyle = '#09090b';
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2.5;
        ctx.fillRect(R * 0.15, -18, 18, 36);
        ctx.strokeRect(R * 0.15, -18, 18, 36);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(R * 0.20, -13, 7, 26);

        ctx.fillStyle = '#facc15';
        [[-12, 26], [-5, 28], [5, 28], [12, 26]].forEach(([oy, ox]) => {
            ctx.beginPath();
            ctx.arc(R * 0.12 + ox * 0.4, oy, 2.6, 0, Math.PI * 2);
            ctx.fill();
        });

        // 6 Tentáculos biológicos largos retorciéndose desde el frente y costados
        for (let t = -2; t <= 2; t++) {
            const ond = Math.sin(ahora / 95 + t * 1.3) * 9;
            ctx.strokeStyle = t % 2 === 0 ? '#f97316' : '#a855f7';
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            ctx.moveTo(R * 0.52, t * 13);
            ctx.quadraticCurveTo(R * 0.84, t * 18 + ond, R * 1.06, t * 11 - ond);
            ctx.stroke();
        }

        // Espinas quitinosas dorsales sobre el techo del Dreadnought
        [-24, -8, 8, 24].forEach(sy => {
            ctx.fillStyle = golpeado ? '#ffffff' : '#7e22ce';
            ctx.beginPath();
            ctx.moveTo(-R * 0.15, sy - 6);
            ctx.lineTo(-R * 0.42, sy);
            ctx.lineTo(-R * 0.15, sy + 6);
            ctx.closePath();
            ctx.fill();
        });

        // Red de venas moradas y ácidas palpitando sobre todo el chasis
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(-R * 0.48, -R * 0.48);
        ctx.lineTo(R * 0.12, -R * 0.22);
        ctx.lineTo(-R * 0.10, R * 0.36);
        ctx.lineTo(R * 0.35, R * 0.44);
        ctx.stroke();

        // --- POD LANZACOHETES ÍCARO EN EL TECHO ---
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.roundRect(-R * 0.48, -24, 36, 48, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        [[-R * 0.36, -12], [-R * 0.36, 12], [-R * 0.22, -12], [-R * 0.22, 12], [-R * 0.29, 0]].forEach(([mx, my]) => {
            ctx.beginPath();
            ctx.arc(mx, my, 4.4, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();
    }

    // ============================================================
    // 5. DIBUJO DEL GRAN REGENTE, ALIADOS, ÉLITES Y COFRE
    // ============================================================
    function dibujarGranRegenteTopDownN6(screenX, screenY, ahora) {
        const parpadeo = ahora < jugador.invulnerableHasta && Math.floor(ahora / 90) % 2 === 0;
        if (parpadeo) return;

        const cx = screenX + jugador.tam / 2;
        const cy = screenY + jugador.tam / 2;
        const radio = jugador.tam * 0.54;
        const escudoActivo = estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto;
        const disparandoAhora = estadoMarineP2.disparando && !escudoActivo;
        const tieneAmetralladora = estadoNivel6 && estadoNivel6.tieneAmetralladora;

        ctx.save();
        ctx.translate(cx, cy);

        if (estadoNivel6 && ahora < estadoNivel6.destelloCuraJugadorHasta) {
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, radio * 1.45, 0, Math.PI * 2);
            ctx.stroke();
        }

        const auraRegente = ctx.createRadialGradient(0, 0, radio * 0.4, 0, 0, radio * 1.45);
        auraRegente.addColorStop(0, tieneAmetralladora ? 'rgba(250, 204, 21, 0.32)' : 'rgba(220, 38, 38, 0.28)');
        auraRegente.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = auraRegente;
        ctx.beginPath();
        ctx.arc(0, 0, radio * 1.45, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.beginPath();
        ctx.arc(3, 4, radio * 0.98, 0, Math.PI * 2);
        ctx.fill();

        ctx.rotate(estadoMarineP2.anguloTopDown);

        [-1, 1].forEach(lado => {
            const hy = lado > 0 ? radio * 0.38 : -radio * 0.98;
            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = '#71717a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(-radio * 0.55, hy, radio * 1.0, radio * 0.60, 5);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(-radio * 0.38, hy + 4);
            ctx.lineTo(radio * 0.28, hy + radio * 0.60 - 4);
            ctx.moveTo(radio * 0.28, hy + 4);
            ctx.lineTo(-radio * 0.38, hy + radio * 0.60 - 4);
            ctx.stroke();
        });

        ctx.fillStyle = '#18181b';
        ctx.strokeStyle = '#52525b';
        ctx.lineWidth = 1.2;
        ctx.fillRect(-radio * 0.96, -radio * 0.52, radio * 0.48, radio * 1.04);
        ctx.strokeRect(-radio * 0.96, -radio * 0.52, radio * 0.48, radio * 1.04);

        const cascoGrad = ctx.createRadialGradient(-2, -2, 2, 0, 0, radio * 0.68);
        cascoGrad.addColorStop(0, '#3f3f46');
        cascoGrad.addColorStop(0.6, '#18181b');
        cascoGrad.addColorStop(1, '#050507');
        ctx.fillStyle = cascoGrad;
        ctx.strokeStyle = '#a1a1aa';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(radio * 0.10, 0, radio * 0.64, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#52525b';
        ctx.fillRect(-radio * 0.32, -2.5, radio * 0.78, 5);

        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(radio * 0.46, -radio * 0.30);
        ctx.lineTo(radio * 0.72, -radio * 0.12);
        ctx.lineTo(radio * 0.72, radio * 0.12);
        ctx.lineTo(radio * 0.46, radio * 0.30);
        ctx.closePath();
        ctx.fill();

        if (!escudoActivo) {
            if (tieneAmetralladora) {
                ctx.fillStyle = '#eab308';
                ctx.fillRect(radio * 0.15, radio * 0.52, 13, 10);

                ctx.fillStyle = '#27272a';
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(radio * 0.10, radio * 0.10, radio * 1.48, 17, 3);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#b91c1c';
                ctx.fillRect(radio * 0.32, radio * 0.14, radio * 0.55, 11);

                const giroCanon = Math.sin(ahora / 25) * 2.2;
                ctx.fillStyle = '#71717a';
                ctx.fillRect(radio * 1.52, radio * 0.12 + giroCanon * 0.3, radio * 0.68, 4);
                ctx.fillRect(radio * 1.52, radio * 0.28 - giroCanon * 0.3, radio * 0.68, 4);
                ctx.fillRect(radio * 1.52, radio * 0.44 + giroCanon * 0.3, radio * 0.68, 4);

                ctx.fillStyle = '#facc15';
                ctx.fillRect(radio * 2.02, radio * 0.10, 5, 16);

                if (disparandoAhora && Math.floor(ahora / 35) % 2 === 0) {
                    const bocaX = radio * 2.26;
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(bocaX, radio * 0.36, 13, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                ctx.fillStyle = '#b91c1c';
                ctx.strokeStyle = '#fecaca';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.roundRect(radio * 0.25, radio * 0.16, radio * 1.25, 10, 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#facc15';
                ctx.fillRect(radio * 0.52, radio * 0.22, 12, 4);

                if (disparandoAhora && Math.floor(ahora / 55) % 2 === 0) {
                    const bocaX = radio * 1.58;
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(bocaX, radio * 0.36, 9, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        if (escudoActivo) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(radio * 0.38, 0, radio * 0.98, -Math.PI * 0.44, Math.PI * 0.44);
            ctx.stroke();

            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(radio * 0.41, 0, radio * 1.02, -Math.PI * 0.40, Math.PI * 0.40);
            ctx.stroke();
        }

        ctx.restore();
    }

    function dibujarSoldadoAliadoCadianN6(al, ahora) {
        if (!al.vivo) return;
        const parpadeo = ahora < al.invulnerableHasta && Math.floor(ahora / 80) % 2 === 0;
        if (parpadeo) return;

        const radio = al.tam * 0.50;

        ctx.save();
        ctx.translate(al.x, al.y);

        if (ahora < al.destelloCuraHasta) {
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, radio * 1.35, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
        ctx.beginPath();
        ctx.arc(2, 3, radio * 0.92, 0, Math.PI * 2);
        ctx.fill();

        for (let c = 0; c < al.vidasMax; c++) {
            const hx = -7 + c * 7;
            const hy = -radio - 8;
            ctx.fillStyle = c < al.vidas ? '#ef4444' : 'rgba(15, 23, 42, 0.75)';
            ctx.beginPath();
            ctx.arc(hx, hy, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.rotate(al.angulo);

        ctx.fillStyle = al.esComandante ? '#15803d' : '#365314';
        ctx.strokeStyle = al.esComandante ? '#facc15' : '#84cc16';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(-radio * 0.50, -radio * 0.92, radio * 0.85, radio * 0.52, 3);
        ctx.roundRect(-radio * 0.50, radio * 0.40, radio * 0.85, radio * 0.52, 3);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = al.esComandante ? '#166534' : '#3f6212';
        ctx.beginPath();
        ctx.arc(radio * 0.06, 0, radio * 0.58, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.moveTo(radio * 0.42, -radio * 0.25);
        ctx.lineTo(radio * 0.62, -radio * 0.10);
        ctx.lineTo(radio * 0.62, radio * 0.10);
        ctx.lineTo(radio * 0.42, radio * 0.25);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#14532d';
        ctx.strokeStyle = '#a3e635';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(radio * 0.20, radio * 0.16, radio * 1.15, 6, 2);
        ctx.fill();
        ctx.stroke();

        if (ahora - al.ultimoDisparo < 75) {
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(radio * 1.42, radio * 0.28, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    function dibujarGuardianEliteTopDownN6(g, ahora) {
        const golpeado = ahora < g.flashHasta;
        const R = g.tam * 0.48;

        ctx.save();
        ctx.translate(g.x + g.tam / 2, g.y + g.tam / 2);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.beginPath();
        ctx.arc(4, 5, R * 1.05, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(10, 5, 18, 0.85)';
        ctx.fillRect(-22, -R - 12, 44, 4);
        ctx.fillStyle = '#c026d3';
        ctx.fillRect(-22, -R - 12, 44 * (g.vida / g.vidaMax), 4);

        ctx.rotate(g.angulo);

        const cierreGarra = g.estadoAtaque === 'tajando' ? -0.25 : Math.sin(ahora / 130) * 0.14;
        [-1, 1].forEach(lado => {
            ctx.save();
            ctx.translate(R * 0.25, lado * R * 0.42);
            ctx.rotate(lado * (0.35 + cierreGarra));

            ctx.fillStyle = golpeado ? '#ffffff' : '#ede9fe';
            ctx.strokeStyle = '#3b0764';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.roundRect(0, -5, R * 0.65, 10, 3);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = golpeado ? '#ffffff' : '#9f1239';
            ctx.strokeStyle = '#fecdd3';
            ctx.beginPath();
            ctx.moveTo(R * 0.55, -6);
            ctx.quadraticCurveTo(R * 1.15, -lado * 10, R * 1.35, lado * 5);
            ctx.lineTo(R * 0.85, lado * 6);
            ctx.lineTo(R * 0.55, 6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        });

        ctx.fillStyle = golpeado ? '#ffffff' : '#3b0764';
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(R * 0.68, 0);
        ctx.lineTo(R * 0.25, -R * 0.72);
        ctx.lineTo(-R * 0.58, -R * 0.58);
        ctx.lineTo(-R * 0.78, 0);
        ctx.lineTo(-R * 0.58, R * 0.58);
        ctx.lineTo(R * 0.25, R * 0.72);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        if (!golpeado) {
            ctx.strokeStyle = '#f97316';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(-R * 0.15, -R * 0.28);
            ctx.lineTo(R * 0.15, R * 0.28);
            ctx.moveTo(R * 0.15, -R * 0.28);
            ctx.lineTo(-R * 0.15, R * 0.28);
            ctx.stroke();
        }

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(R * 0.52, -5, 2.5, 0, Math.PI * 2);
        ctx.arc(R * 0.52, 5, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function dibujarCofreAmetralladoraN6(cofre, ahora) {
        const pulso = Math.sin(ahora / 130) * 4;
        ctx.save();
        ctx.translate(cofre.x, cofre.y);

        const aura = ctx.createRadialGradient(0, 0, 6, 0, 0, 44 + pulso);
        aura.addColorStop(0, 'rgba(250, 204, 21, 0.55)');
        aura.addColorStop(1, 'rgba(250, 204, 21, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, 44 + pulso, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(-cofre.ancho / 2, -cofre.alto / 2, cofre.ancho, cofre.alto, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(-cofre.ancho / 2 + 4, -5, cofre.ancho - 8, 10);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(-6, -8, 12, 16);

        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.fillStyle = '#fef08a';
        ctx.textAlign = 'center';
        ctx.fillText('AMETRALLADORA PESADA', 0, -cofre.alto / 2 - 9);
        ctx.restore();
    }

    // ============================================================
    // 6. ESCENARIO DE AVENIDA AMPLIA Y DIÁLOGO INICIAL
    // ============================================================
    function dibujarEscenarioAvenidaN6(w, h, ahora) {
        const anchoEd = estadoNivel6.anchoEdificio;
        const anchoCalle = w - anchoEd * 2;

        const asfaltoGrad = ctx.createLinearGradient(anchoEd, 0, w - anchoEd, 0);
        asfaltoGrad.addColorStop(0, '#18181b');
        asfaltoGrad.addColorStop(0.5, '#27272a');
        asfaltoGrad.addColorStop(1, '#18181b');
        ctx.fillStyle = asfaltoGrad;
        ctx.fillRect(anchoEd, 0, anchoCalle, h);

        const pasoGrid = 48;
        const offsetGridY = estadoNivel6.scrollCalleY % pasoGrid;
        ctx.strokeStyle = 'rgba(161, 161, 170, 0.11)';
        ctx.lineWidth = 1.2;
        for (let gx = anchoEd; gx <= w - anchoEd; gx += pasoGrid) {
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.lineTo(gx, h);
            ctx.stroke();
        }
        for (let gy = offsetGridY - pasoGrid; gy < h + pasoGrid; gy += pasoGrid) {
            ctx.beginPath();
            ctx.moveTo(anchoEd, gy);
            ctx.lineTo(w - anchoEd, gy);
            ctx.stroke();
        }

        const pasoLinea = 96;
        const offsetLinea = estadoNivel6.scrollCalleY % pasoLinea;
        ctx.fillStyle = 'rgba(234, 179, 8, 0.36)';
        for (let ly = offsetLinea - pasoLinea; ly < h + pasoLinea; ly += pasoLinea) {
            ctx.fillRect(w / 2 - 3, ly, 6, 44);
        }

        estadoNivel6.cochesAvenida.forEach(c => {
            c.y += estadoNivel6.velAvanceCalle;
            if (c.y > h + 110) {
                c.y = -110;
                c.x = anchoEd + 50 + Math.random() * Math.max(80, anchoCalle - 140);
            }

            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(c.x + 5, c.y + 5, c.ancho, c.alto);

            ctx.fillStyle = c.color;
            ctx.strokeStyle = '#09090b';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.roundRect(c.x, c.y, c.ancho, c.alto, 6);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#090d16';
            ctx.fillRect(c.x + 6, c.y + 14, c.ancho - 12, 15);
            ctx.fillRect(c.x + 6, c.y + c.alto - 24, c.ancho - 12, 12);

            if (c.enLlamas) {
                const pulso = Math.sin(ahora / 90 + c.x) * 3;
                ctx.fillStyle = 'rgba(249, 115, 22, 0.85)';
                ctx.beginPath();
                ctx.arc(c.x + c.ancho * 0.5, c.y + 12, 10 + pulso, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(c.x + c.ancho * 0.5, c.y + 12, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });

        estadoNivel6.edificiosLaterales.forEach(ed => {
            ed.y += estadoNivel6.velAvanceCalle;
            if (ed.y > h + 60) {
                ed.y -= (estadoNivel6.edificiosLaterales.length * 180);
            }

            [
                { x: 0, llamas: ed.enLlamasIzq },
                { x: w - anchoEd, llamas: ed.enLlamasDer }
            ].forEach(lado => {
                ctx.fillStyle = '#120f17';
                ctx.strokeStyle = '#3f3f46';
                ctx.lineWidth = 2;
                ctx.fillRect(lado.x, ed.y, anchoEd, ed.alto);
                ctx.strokeRect(lado.x, ed.y, anchoEd, ed.alto);

                ctx.fillStyle = '#1f1b24';
                ctx.fillRect(lado.x + 10, ed.y + 12, anchoEd - 20, ed.alto - 24);

                for (let wy = ed.y + 22; wy < ed.y + ed.alto - 24; wy += 32) {
                    for (let wx = lado.x + 16; wx < lado.x + anchoEd - 22; wx += 28) {
                        ctx.fillStyle = ((wx + Math.floor(ed.y)) % 3 === 0)
                            ? 'rgba(234, 88, 12, 0.65)'
                            : '#09090b';
                        ctx.fillRect(wx, wy, 14, 18);
                    }
                }

                ctx.fillStyle = '#52525b';
                const aceraX = lado.x === 0 ? anchoEd - 11 : w - anchoEd;
                ctx.fillRect(aceraX, ed.y, 11, ed.alto);

                if (lado.llamas) {
                    const fx = lado.x === 0 ? anchoEd - 22 : w - anchoEd + 22;
                    const fy = ed.y + ed.alto * 0.5;
                    ctx.fillStyle = 'rgba(234, 88, 12, 0.78)';
                    ctx.beginPath();
                    ctx.arc(fx, fy, 17 + Math.sin(ahora / 100) * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        });
    }

    function dibujarDialogoInicialN6(w, h, ahora) {
        const dialogos = [
            {
                hablante: 'COMANDANTE DE LA GUARDIA DE LA CIUDAD',
                colorNombre: '#4ade80',
                texto: '«¡No lo puedo creer, es realmente usted! Han pasado 200 años desde que desapareció, es una leyenda. No sé qué fue lo que le pasó, pero estamos en una guerra contra unos invasores. Le suplicamos que nos ayude, Gran Regente. Necesitamos llegar al frente de la base enemiga, pero como puede ver es un caos la ciudad. ¿Nos puede liderar? Confiamos en usted.»',
                duracion: 7800
            },
            {
                hablante: 'GRAN REGENTE (TÚ)',
                colorNombre: '#f87171',
                texto: '«De vuelta a casa.»',
                duracion: 2600
            }
        ];

        const actual = dialogos[estadoNivel6.pasoDialogo];
        if (!actual) return;

        const comandante = estadoNivel6.aliados.find(a => a.esComandante);
        const targetX = estadoNivel6.pasoDialogo === 0 && comandante
            ? comandante.x
            : estadoNivel6.playerX + jugador.tam / 2;
        const targetY = estadoNivel6.pasoDialogo === 0 && comandante
            ? comandante.y
            : estadoNivel6.playerY + jugador.tam / 2;

        ctx.save();
        ctx.strokeStyle = actual.colorNombre;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(targetX, targetY, 26 + Math.sin(ahora / 120) * 3, 0, Math.PI * 2);
        ctx.stroke();

        const boxW = Math.min(820, w * 0.78);
        const boxH = 148;
        const boxX = (w - boxW) / 2;
        const boxY = 58;

        ctx.fillStyle = 'rgba(9, 7, 16, 0.94)';
        ctx.strokeStyle = actual.colorNombre;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 12);
        ctx.fill();
        ctx.stroke();

        ctx.font = 'bold 15px "Courier New", monospace';
        ctx.fillStyle = actual.colorNombre;
        ctx.textAlign = 'left';
        ctx.fillText(actual.hablante, boxX + 22, boxY + 28);

        ctx.font = '15px "Courier New", monospace';
        ctx.fillStyle = '#f8fafc';
        const palabras = actual.texto.split(' ');
        let linea = '';
        let ly = boxY + 56;
        const maxAnchoTexto = boxW - 44;

        palabras.forEach(pal => {
            const prueba = linea + pal + ' ';
            if (ctx.measureText(prueba).width > maxAnchoTexto) {
                ctx.fillText(linea.trim(), boxX + 22, ly);
                linea = pal + ' ';
                ly += 22;
            } else {
                linea = prueba;
            }
        });
        if (linea.trim()) {
            ctx.fillText(linea.trim(), boxX + 22, ly);
        }

        ctx.restore();

        if (ahora - estadoNivel6.inicioPasoDialogo >= actual.duracion) {
            estadoNivel6.pasoDialogo++;
            estadoNivel6.inicioPasoDialogo = ahora;

            if (estadoNivel6.pasoDialogo >= dialogos.length) {
                estadoNivel6.fase = 'combate';
                estadoNivel6.velAvanceCalle = 2.4;
                estadoNivel6.ultimoSpawnBotiquin = ahora;
                puedeMoverse = true;
                iniciarSiguienteOleadaN6(ahora);
            }
        }
    }

    // ============================================================
    // 7. BUCLE PRINCIPAL DEL NIVEL 6
    // ============================================================
    function bucleNivel6() {
        if (!juegoActivo || nivelActual !== 6 || !estadoNivel6) return;

        const ahora = Date.now();
        const w = canvas.width;
        const h = canvas.height;
        const anchoEd = estadoNivel6.anchoEdificio;

        estadoNivel6.scrollCalleY += estadoNivel6.velAvanceCalle;
        dibujarEscenarioAvenidaN6(w, h, ahora);

        if (estadoNivel6.fase === 'dialogo') {
            estadoNivel6.aliados.forEach(al => dibujarSoldadoAliadoCadianN6(al, ahora));
            dibujarGranRegenteTopDownN6(estadoNivel6.playerX, estadoNivel6.playerY, ahora);
            dibujarDialogoInicialN6(w, h, ahora);
            animacionIdNivel6 = requestAnimationFrame(bucleNivel6);
            return;
        }

        // Movimiento libre del Gran Regente
        if (puedeMoverse && jugador.vidas > 0 && estadoNivel6.fase === 'combate') {
            let mx = 0;
            let my = 0;
            if (teclas.ArrowLeft || teclasExtraP2.KeyA) mx -= 1;
            if (teclas.ArrowRight || teclasExtraP2.KeyD) mx += 1;
            if (teclas.ArrowUp || teclasExtraP2.KeyW) my -= 1;
            if (teclas.ArrowDown || teclasExtraP2.KeyS) my += 1;

            if (mx !== 0 || my !== 0) {
                const norm = Math.hypot(mx, my);
                estadoNivel6.playerX += (mx / norm) * 6.5;
                estadoNivel6.playerY += (my / norm) * 6.5;
            }

            estadoNivel6.playerX = Math.max(anchoEd + 10, Math.min(w - anchoEd - jugador.tam - 10, estadoNivel6.playerX));
            estadoNivel6.playerY = Math.max(60, Math.min(h - jugador.tam - 60, estadoNivel6.playerY));
        }

        const nRegCx = estadoNivel6.playerX + jugador.tam / 2;
        const nRegCy = estadoNivel6.playerY + jugador.tam / 2;

        // Control de las 15 Hordas + Invocación del Jefe Final cuando YA NO HAY NINGÚN ENEMIGO
        if (estadoNivel6.fase === 'combate' && jugador.vidas > 0) {
            if (estadoNivel6.oleadaActual < estadoNivel6.totalOleadas && ahora >= estadoNivel6.proximaOleadaEn) {
                iniciarSiguienteOleadaN6(ahora);
            }
            generarEnemigosPendientesN6(w, h, ahora);

            // Verificar si ya terminaron las 15 hordas y NO queda ningún enemigo vivo en el mapa
            const campoCompletamenteLimpio =
                estadoNivel6.oleadaActual >= estadoNivel6.totalOleadas &&
                estadoNivel6.pendientesNormales === 0 &&
                estadoNivel6.pendientesElites === 0 &&
                estadoNivel6.enemigosNormales.length === 0 &&
                estadoNivel6.guardianesElites.length === 0 &&
                estadoNivel6.jefesAlfa.length === 0;

            if (campoCompletamenteLimpio && !estadoNivel6.jefeFinalInvocado) {
                estadoNivel6.jefeFinalInvocado = true;
                estadoNivel6.velAvanceCalle = 0; // El escuadrón llega al frente final de la base enemiga
                estadoNivel6.jefeFinalDreadnought = crearJefeFinalDreadnoughtN6(w, ahora);
                estadoNivel6.mensajeAlerta = '🚨 ¡AVENIDA DESPEJADA — EL DREADNOUGHT REDEMPTOR INFECTADO (50,000 HP) BLOQUEA LA BASE!';
                estadoNivel6.mensajeAlertaHasta = ahora + 4200;
                document.getElementById('titulo-nivel-activo').textContent =
                    'NIVEL 6 — COMBATE FINAL: DREADNOUGHT REDEMPTOR INFECTADO';
            }

            if (ahora - estadoNivel6.ultimoSpawnBotiquin >= 11000 && estadoNivel6.botiquinesCampo.length < 2) {
                estadoNivel6.ultimoSpawnBotiquin = ahora;
                estadoNivel6.botiquinesCampo.push({
                    x: anchoEd + 45 + Math.random() * Math.max(80, w - anchoEd * 2 - 90),
                    y: -30,
                    radio: 15
                });
            }
        }

        // Cofre de Ametralladora Pesada (Horda 7)
        if (estadoNivel6.cofreArma) {
            const cofre = estadoNivel6.cofreArma;
            dibujarCofreAmetralladoraN6(cofre, ahora);

            if (Math.hypot(nRegCx - cofre.x, nRegCy - cofre.y) <= jugador.tam * 0.65 + cofre.ancho * 0.5) {
                estadoNivel6.tieneAmetralladora = true;
                estadoNivel6.cofreArma = null;
                estadoNivel6.mensajeAlerta = '🔥 ¡AMETRALLADORA PESADA EQUIPADA: 20 DISPAROS/SEG Y 20 DE DAÑO A JEFES!';
                estadoNivel6.mensajeAlertaHasta = ahora + 3200;
                actualizarHudNivel6();
            }
        }

        // Botiquines en el camino
        estadoNivel6.botiquinesCampo = estadoNivel6.botiquinesCampo.filter(bot => {
            bot.y += Math.max(1.2, estadoNivel6.velAvanceCalle);
            if (bot.y > h + 40) return false;

            ctx.save();
            ctx.fillStyle = 'rgba(74, 222, 128, 0.25)';
            ctx.beginPath();
            ctx.arc(bot.x, bot.y, bot.radio + 6 + Math.sin(ahora / 120) * 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(bot.x - 12, bot.y - 9, 24, 18, 4);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(bot.x - 2.5, bot.y - 6, 5, 12);
            ctx.fillRect(bot.x - 6, bot.y - 2.5, 12, 5);
            ctx.restore();

            let recogido = Math.hypot(nRegCx - bot.x, nRegCy - bot.y) <= bot.radio + jugador.tam * 0.45;
            if (!recogido) {
                recogido = estadoNivel6.aliados.some(al =>
                    al.vivo && Math.hypot(al.x - bot.x, al.y - bot.y) <= bot.radio + al.tam * 0.5
                );
            }

            if (recogido) {
                estadoNivel6.botiquines++;
                estadoNivel6.mensajeAlerta = `✚ BOTIQUÍN RECOGIDO (${estadoNivel6.botiquines} GUARDADOS — TECLA [B] PARA CURAR)`;
                estadoNivel6.mensajeAlertaHasta = ahora + 1800;
                actualizarHudNivel6();
                return false;
            }
            return true;
        });

        // Charcos, avisos y proyectiles de ácido
        estadoNivel6.charcosAcido = estadoNivel6.charcosAcido.filter(ch => {
            ch.y += estadoNivel6.velAvanceCalle;
            if (ahora >= ch.expiraEn || ch.y > h + 40) return false;

            ctx.fillStyle = 'rgba(132, 204, 22, 0.55)';
            ctx.beginPath();
            ctx.arc(ch.x, ch.y, ch.radio, 0, Math.PI * 2);
            ctx.fill();
            return true;
        });

        estadoNivel6.avisosAcidoJefes = estadoNivel6.avisosAcidoJefes.filter(av => {
            const prog = Math.min(1, (ahora - av.creadoEn) / 1800);
            if (prog < 1) {
                ctx.save();
                ctx.strokeStyle = '#a3e635';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(av.x, av.y, av.radio, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = `rgba(163, 230, 53, ${0.15 + prog * 0.3})`;
                ctx.beginPath();
                ctx.arc(av.x, av.y, av.radio * prog, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return true;
            } else {
                if (Math.hypot(nRegCx - av.x, nRegCy - av.y) <= av.radio + jugador.tam * 0.4) {
                    if (!estadoMarineP2.escudoActivo || estadoMarineP2.escudoRoto) recibirDanioJugadorNivel6(1);
                }
                estadoNivel6.aliados.forEach(al => {
                    if (al.vivo && Math.hypot(al.x - av.x, al.y - av.y) <= av.radio + al.tam * 0.4) {
                        danarAliadoN6(al, 1, ahora);
                    }
                });
                estadoNivel6.charcosAcido.push({ x: av.x, y: av.y, radio: av.radio * 0.8, expiraEn: ahora + 2200 });
                return false;
            }
        });

        estadoNivel6.proyectilesAcido = estadoNivel6.proyectilesAcido.filter(ac => {
            ac.x += ac.vx;
            ac.y += ac.vy;
            ac.vida--;

            ctx.fillStyle = '#a3e635';
            ctx.beginPath();
            ctx.arc(ac.x, ac.y, 4.5, 0, Math.PI * 2);
            ctx.fill();

            if (Math.hypot(ac.x - nRegCx, ac.y - nRegCy) <= jugador.tam * 0.45) {
                if (!estadoMarineP2.escudoActivo || estadoMarineP2.escudoRoto) recibirDanioJugadorNivel6(1);
                return false;
            }

            for (const al of estadoNivel6.aliados) {
                if (al.vivo && Math.hypot(ac.x - al.x, ac.y - al.y) <= al.tam * 0.48) {
                    danarAliadoN6(al, 1, ahora);
                    return false;
                }
            }

            if (ac.vida <= 0) {
                estadoNivel6.charcosAcido.push({ x: ac.x, y: ac.y, radio: 18, expiraEn: ahora + 2200 });
                return false;
            }
            return ac.y < h + 40;
        });

        // IA de los 10 Soldados Aliados
        estadoNivel6.aliados.forEach(al => {
            if (!al.vivo) return;

            let objetivo = null;
            let distMin = Infinity;

            if (estadoNivel6.jefeFinalDreadnought) {
                const df = estadoNivel6.jefeFinalDreadnought;
                const d = Math.hypot(df.x - al.x, df.y - al.y);
                if (d < distMin) {
                    distMin = d;
                    objetivo = { x: df.x, y: df.y };
                }
            }
            estadoNivel6.jefesAlfa.forEach(j => {
                const d = Math.hypot(j.x - al.x, j.y - al.y);
                if (d < distMin) {
                    distMin = d;
                    objetivo = { x: j.x, y: j.y };
                }
            });
            estadoNivel6.enemigosNormales.forEach(en => {
                const d = Math.hypot((en.x + en.tam / 2) - al.x, (en.y + en.tam / 2) - al.y);
                if (d < distMin) {
                    distMin = d;
                    objetivo = { x: en.x + en.tam / 2, y: en.y + en.tam / 2 };
                }
            });
            estadoNivel6.guardianesElites.forEach(g => {
                const d = Math.hypot((g.x + g.tam / 2) - al.x, (g.y + g.tam / 2) - al.y);
                if (d < distMin) {
                    distMin = d;
                    objetivo = { x: g.x + g.tam / 2, y: g.y + g.tam / 2 };
                }
            });

            if (objetivo) {
                al.angulo = Math.atan2(objetivo.y - al.y, objetivo.x - al.x);

                if (estadoNivel6.fase === 'combate' && ahora - al.ultimoDisparo >= 333) {
                    al.ultimoDisparo = ahora;
                    estadoNivel6.balasAliados.push({
                        x: al.x + Math.cos(al.angulo) * 14,
                        y: al.y + Math.sin(al.angulo) * 14,
                        vx: Math.cos(al.angulo) * 16,
                        vy: Math.sin(al.angulo) * 16,
                        danio: 10
                    });
                }
            } else {
                al.angulo = -Math.PI / 2;
            }

            // Esquive activo
            if (ahora - al.ultimoEsquive >= 1050) {
                let amenazaX = null;
                let amenazaY = null;

                if (estadoNivel6.jefeFinalDreadnought) {
                    const df = estadoNivel6.jefeFinalDreadnought;
                    if (Math.hypot(df.x - al.x, df.y - al.y) < df.radio + 95) {
                        amenazaX = df.x;
                        amenazaY = df.y;
                    }
                }
                if (amenazaX === null) {
                    for (const j of estadoNivel6.jefesAlfa) {
                        if (Math.hypot(j.x - al.x, j.y - al.y) < 130) {
                            amenazaX = j.x;
                            amenazaY = j.y;
                            break;
                        }
                    }
                }
                if (amenazaX === null) {
                    for (const g of estadoNivel6.guardianesElites) {
                        if (Math.hypot((g.x + g.tam / 2) - al.x, (g.y + g.tam / 2) - al.y) < 90) {
                            amenazaX = g.x + g.tam / 2;
                            amenazaY = g.y + g.tam / 2;
                            break;
                        }
                    }
                }
                if (amenazaX === null) {
                    for (const en of estadoNivel6.enemigosNormales) {
                        if (Math.hypot((en.x + en.tam / 2) - al.x, (en.y + en.tam / 2) - al.y) < 60) {
                            amenazaX = en.x + en.tam / 2;
                            amenazaY = en.y + en.tam / 2;
                            break;
                        }
                    }
                }

                if (amenazaX !== null) {
                    al.ultimoEsquive = ahora;
                    const angEscape = Math.atan2(al.y - amenazaY, al.x - amenazaX) + (Math.random() > 0.5 ? 0.55 : -0.55);
                    al.dashVx = Math.cos(angEscape) * 10.5;
                    al.dashVy = Math.sin(angEscape) * 10.5;
                }
            }

            if (Math.hypot(al.dashVx, al.dashVy) > 0.5) {
                al.x += al.dashVx;
                al.y += al.dashVy;
                al.dashVx *= 0.82;
                al.dashVy *= 0.82;
            } else {
                const destX = Math.max(anchoEd + 22, Math.min(w - anchoEd - 22, nRegCx + al.offsetX));
                const destY = Math.max(75, Math.min(h - 75, nRegCy + al.offsetY));
                const dxF = destX - al.x;
                const dyF = destY - al.y;
                const dF = Math.hypot(dxF, dyF);
                if (dF > 12) {
                    al.x += (dxF / dF) * 3.8;
                    al.y += (dyF / dF) * 3.8;
                }
            }

            estadoNivel6.aliados.forEach(otro => {
                if (otro.id === al.id || !otro.vivo) return;
                const dxS = al.x - otro.x;
                const dyS = al.y - otro.y;
                const dS = Math.hypot(dxS, dyS);
                if (dS > 0 && dS < 32) {
                    al.x += (dxS / dS) * 1.8;
                    al.y += (dyS / dS) * 1.8;
                }
            });

            al.x = Math.max(anchoEd + 20, Math.min(w - anchoEd - 20, al.x));
            al.y = Math.max(68, Math.min(h - 68, al.y));
        });

        // Auto-apuntado del Gran Regente
        let objRegX = null;
        let objRegY = null;
        let distRegMin = Infinity;

        if (estadoNivel6.jefeFinalDreadnought) {
            const df = estadoNivel6.jefeFinalDreadnought;
            const d = Math.hypot(df.x - nRegCx, df.y - nRegCy);
            if (d < distRegMin) {
                distRegMin = d;
                objRegX = df.x;
                objRegY = df.y;
            }
        }
        estadoNivel6.jefesAlfa.forEach(j => {
            const d = Math.hypot(j.x - nRegCx, j.y - nRegCy);
            if (d < distRegMin) {
                distRegMin = d;
                objRegX = j.x;
                objRegY = j.y;
            }
        });
        estadoNivel6.enemigosNormales.forEach(en => {
            const ex = en.x + en.tam / 2;
            const ey = en.y + en.tam / 2;
            const d = Math.hypot(ex - nRegCx, ey - nRegCy);
            if (d < distRegMin) {
                distRegMin = d;
                objRegX = ex;
                objRegY = ey;
            }
        });
        estadoNivel6.guardianesElites.forEach(g => {
            const gx = g.x + g.tam / 2;
            const gy = g.y + g.tam / 2;
            const d = Math.hypot(gx - nRegCx, gy - nRegCy);
            if (d < distRegMin) {
                distRegMin = d;
                objRegX = gx;
                objRegY = gy;
            }
        });

        if (objRegX !== null) {
            estadoMarineP2.anguloTopDown = Math.atan2(objRegY - nRegCy, objRegX - nRegCx);
        }

        // Disparo del Gran Regente: 20 balas/seg (50ms) con Ametralladora Pesada
        const cadenciaRegente = estadoNivel6.tieneAmetralladora ? 50 : 125;
        if (puedeMoverse && jugador.vidas > 0 && estadoNivel6.fase === 'combate') {
            if (estadoMarineP2.disparando && !estadoMarineP2.escudoActivo && ahora - estadoMarineP2.ultimoDisparo >= cadenciaRegente) {
                estadoMarineP2.ultimoDisparo = ahora;
                const ang = estadoMarineP2.anguloTopDown;
                estadoMarineP2.balas.push({
                    x: nRegCx + Math.cos(ang) * 26,
                    y: nRegCy + Math.sin(ang) * 26,
                    vx: Math.cos(ang) * 21,
                    vy: Math.sin(ang) * 21,
                    danioNormal: 15,
                    danioJefe: estadoNivel6.tieneAmetralladora ? 20 : 12,
                    esAmetralladora: estadoNivel6.tieneAmetralladora
                });
            }
        }

        // Monstruos Normales
        estadoNivel6.enemigosNormales.forEach(en => {
            const ex = en.x + en.tam / 2;
            const ey = en.y + en.tam / 2;

            let targetX = nRegCx;
            let targetY = nRegCy;
            let targetEsAliado = null;
            let dMin = Math.hypot(nRegCx - ex, nRegCy - ey);

            estadoNivel6.aliados.forEach(al => {
                if (!al.vivo) return;
                const dAl = Math.hypot(al.x - ex, al.y - ey);
                if (dAl < dMin) {
                    dMin = dAl;
                    targetX = al.x;
                    targetY = al.y;
                    targetEsAliado = al;
                }
            });

            const dx = targetX - ex;
            const dy = targetY - ey;
            const d = Math.hypot(dx, dy) || 1;
            const vel = en.esLanzadorAcido ? 2.1 : 2.9;

            if (en.esLanzadorAcido && d < 280 && d > 130) {
                if (ahora - en.ultimoAcido >= 2900) {
                    en.ultimoAcido = ahora;
                    estadoNivel6.proyectilesAcido.push({
                        x: ex,
                        y: ey,
                        vx: (dx / d) * 6.5,
                        vy: (dy / d) * 6.5,
                        vida: 45
                    });
                }
            } else {
                en.vx = (dx / d) * vel;
                en.vy = (dy / d) * vel;
                en.x += en.vx;
                en.y += en.vy;
            }

            if (d < (en.tam * 0.42 + (targetEsAliado ? targetEsAliado.tam * 0.42 : jugador.tam * 0.42))) {
                if (targetEsAliado) {
                    danarAliadoN6(targetEsAliado, 1, ahora);
                    en.x -= (dx / d) * 20;
                    en.y -= (dy / d) * 20;
                } else {
                    if (estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto) {
                        en.x -= (dx / d) * 26;
                        en.y -= (dy / d) * 26;
                    } else {
                        recibirDanioJugadorNivel6(1);
                    }
                }
            }

            dibujarEnemigoTiranidoN5(en, ahora, true);
        });

        // Guardianes Élites
        estadoNivel6.guardianesElites.forEach(g => {
            const gx = g.x + g.tam / 2;
            const gy = g.y + g.tam / 2;

            let targetX = nRegCx;
            let targetY = nRegCy;
            let targetEsAliado = null;
            let dMin = Math.hypot(nRegCx - gx, nRegCy - gy);

            estadoNivel6.aliados.forEach(al => {
                if (!al.vivo) return;
                const dAl = Math.hypot(al.x - gx, al.y - gy);
                if (dAl < dMin) {
                    dMin = dAl;
                    targetX = al.x;
                    targetY = al.y;
                    targetEsAliado = al;
                }
            });

            const dx = targetX - gx;
            const dy = targetY - gy;
            const d = Math.hypot(dx, dy) || 1;
            g.angulo = Math.atan2(dy, dx);

            if (g.estadoAtaque === 'caminando') {
                if (d <= 54) {
                    g.estadoAtaque = 'tajando';
                    g.inicioAtaque = ahora;
                    g.golpeAplicado = false;
                } else {
                    g.x += (dx / d) * 2.2;
                    g.y += (dy / d) * 2.2;
                }
            } else if (g.estadoAtaque === 'tajando') {
                if (!g.golpeAplicado && d <= 66) {
                    g.golpeAplicado = true;
                    if (targetEsAliado) {
                        danarAliadoN6(targetEsAliado, 1, ahora);
                    } else {
                        if (estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto) {
                            absorberGolpeEscudoContraJefe();
                        } else {
                            recibirDanioJugadorNivel6(2);
                        }
                    }
                }
                if (ahora - g.inicioAtaque >= 450) {
                    g.estadoAtaque = 'caminando';
                }
            }

            dibujarGuardianEliteTopDownN6(g, ahora);
        });

        // Depredadores Alfa (Hordas 9-15)
        estadoNivel6.jefesAlfa.forEach(jefe => {
            if (puedeMoverse && jugador.vidas > 0 && estadoNivel6.fase === 'combate') {
                let tx = nRegCx;
                let ty = nRegCy;
                let tAliado = null;
                let dMin = Math.hypot(nRegCx - jefe.x, nRegCy - jefe.y);

                estadoNivel6.aliados.forEach(al => {
                    if (!al.vivo) return;
                    const dAl = Math.hypot(al.x - jefe.x, al.y - jefe.y);
                    if (dAl < dMin) {
                        dMin = dAl;
                        tx = al.x;
                        ty = al.y;
                        tAliado = al;
                    }
                });

                const dx = tx - jefe.x;
                const dy = ty - jefe.y;
                const dist = Math.hypot(dx, dy) || 1;

                if (jefe.estado === 'acechando') {
                    jefe.angulo = Math.atan2(dy, dx);
                    jefe.x += (dx / dist) * 4.4;
                    jefe.y += (dy / dist) * 4.4;

                    if (ahora >= jefe.proximoAtaqueEn) {
                        const eleccion = Math.random();
                        if (eleccion < 0.45) {
                            jefe.estado = 'aviso_embestida';
                            jefe.inicioEstado = ahora;
                            jefe.embestidaOrigenX = jefe.x;
                            jefe.embestidaOrigenY = jefe.y;
                            const angEmb = Math.atan2(dy, dx);
                            jefe.angulo = angEmb;
                            const distEmb = Math.min(380, Math.max(220, dist + 90));
                            jefe.embestidaDestinoX = Math.max(anchoEd + 45, Math.min(w - anchoEd - 45, jefe.x + Math.cos(angEmb) * distEmb));
                            jefe.embestidaDestinoY = Math.max(68, Math.min(h - 68, jefe.y + Math.sin(angEmb) * distEmb));
                            jefe.embestidaGolpeo = false;
                        } else if (eleccion < 0.75) {
                            jefe.estado = 'acechando';
                            jefe.proximoAtaqueEn = ahora + 1600;
                            for (let k = 0; k < 5; k++) {
                                estadoNivel6.avisosAcidoJefes.push({
                                    x: anchoEd + 40 + Math.random() * Math.max(80, w - anchoEd * 2 - 80),
                                    y: 75 + Math.random() * (h - 150),
                                    radio: 30,
                                    creadoEn: ahora
                                });
                            }
                        } else {

                } else if (jefe.estado === 'aviso_embestida') {

                } else if (jefe.estado === 'embistiendo') {
                    const tEmb = Math.min(1, (ahora - jefe.inicioEstado) / 260);

                    if (!jefe.embestidaGolpeo) {

                } else if (jefe.estado === 'aviso_cola') {

                } else if (jefe.estado === 'golpe_cola') {
                    const tCola = Math.min(1, (ahora - jefe.inicioEstado) / 220);
                    if (!jefe.colaGolpeo) {

            if (jefe.estado === 'aviso_embestida') {

            if (typeof dibujarJefeVonRyanTopDownN5 === 'function') {

        });

        // ============================================================
        // 8. IA Y 7 HABILIDADES DEL JEFE FINAL: DREADNOUGHT INFECTADO (50,000 HP)
        // ============================================================
        if (estadoNivel6.jefeFinalDreadnought) {

                        else recibirDanioJugadorNivel6(2);
                    }

                    if (ahora >= dread.proximoAtaqueEn) {
                        const r = Math.random();

                            const baseAng = Math.atan2(dy, dx);

                                estadoNivel6.proyectilesDreadnought.push({
                                    tipo: 'plasma',

                                    vida: 90
                                });

                            dread.proximoAtaqueEn = ahora + 1850;
                        } else if (r < 0.32) {

                            for (let m = 0; m < 9; m++) {

                                });
                            }
                            dread.proximoAtaqueEn = ahora + 2100;
                        } else if (r < 0.48) {
                            // HABILIDAD 3: TORMENTA DE CAÑÓN ROTATIVO (14 balas rápidas)
                            dread.estado = 'rotativo';
                            dread.inicioEstado = ahora;
                            dread.ultimoDisparoRotativo = 0;
                            dread.rafagasDisparadas = 0;
                        } else if (r < 0.64) {
                            // HABILIDAD 4: EMBESTIDA SÍSMICA + DOBLE ONDA EXPANSIVA
                            dread.estado = 'aviso_embestida';
                            dread.inicioEstado = ahora;
                            dread.embestidaOrigenX = dread.x;
                            dread.embestidaOrigenY = dread.y;
                            const angEmb = Math.atan2(dy, dx);
                            dread.angulo = angEmb;
                            const distEmb = Math.min(390, Math.max(220, dist));
                            dread.embestidaDestinoX = Math.max(anchoEd + dread.radio, Math.min(w - anchoEd - dread.radio, dread.x + Math.cos(angEmb) * distEmb));
                            dread.embestidaDestinoY = Math.max(dread.radio + 30, Math.min(h - dread.radio - 30, dread.y + Math.sin(angEmb) * distEmb));
                            dread.embestidaGolpeo = false;
                        } else if (r < 0.80) {
                            // HABILIDAD 5: RAYO BARRIDO DE PLASMA CORRUPTO (Láser gigante de 75 grados)
                            dread.estado = 'aviso_laser';
                            dread.inicioEstado = ahora;
                            dread.laserAnguloInicio = Math.atan2(dy, dx) - 0.65;
                            dread.laserAnguloActual = dread.laserAnguloInicio;
                            dread.laserGolpeoJugador = false;

                            // HABILIDAD 6: AZOTE DE LÁTIGOS DE TENTÁCULOS BIOLÓGICOS

                            dread.inicioEstado = ahora;

                } else if (dread.estado === 'rotativo') {

                        });

                        dread.proximoAtaqueEn = ahora + 1700;

                } else if (dread.estado === 'aviso_embestida') {

                    dread.y = dread.embestidaOrigenY + (dread.embestidaDestinoY - dread.embestidaOrigenY) * tEmb;

        // Proyectiles, Misiles Ícaro y Ondas de Choque del Dreadnought
        estadoNivel6.proyectilesDreadnought = estadoNivel6.proyectilesDreadnought.filter(p => {

            ctx.strokeStyle = `rgba(168, 85, 247, ${1 - prog})`;

        // Proyectiles del Gran Regente
        estadoMarineP2.balas = estadoMarineP2.balas.filter(b => {

            ctx.arc(b.x, b.y, b.esAmetralladora ? 4.5 : 3.8, 0, Math.PI * 2);

            ctx.moveTo(b.x, b.y);

        estadoNivel6.aliados.forEach(al => dibujarSoldadoAliadoCadianN6(al, ahora));

        if (estadoNivel6.fase === 'combate' &&

        ctx.fillStyle = '#f3e8ff';
        ctx.textAlign = 'left';
        const infoOleada = estadoNivel6.fase === 'victoria'
            ? '¡VICTORIA — DREADNOUGHT CORRUPTO ANIQUILADO!'
            : (estadoNivel6.jefeFinalInvocado
                ? 'COMBATE FINAL — ¡DESTRUYE AL DREADNOUGHT INFECTADO!'
                : (estadoNivel6.oleadaActual < estadoNivel6.totalOleadas
                    ? `HORDA ${estadoNivel6.oleadaActual}/${estadoNivel6.totalOleadas} | PRÓXIMA EN: ${tiempoProx}s`
                    : 'HORDA 15/15 — ¡ELIMINA A TODOS PARA ENFRENTAR AL JEFE!'));
        ctx.fillText(infoOleada, anchoEd + 24, 63);

        if (ahora < estadoNivel6.mensajeAlertaHasta) {
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.fillStyle = '#facc15';
            ctx.textAlign = 'center';
            ctx.fillText(estadoNivel6.mensajeAlerta, w / 2, 92);
        }
        ctx.restore();

        if (textoContador !== '') {
            ctx.font = 'bold 44px "Courier New", monospace';
            ctx.fillStyle = textoContador === 'GAME OVER' ? '#ff1e1e' : '#ffd60a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(textoContador, w / 2, h / 2 - 20);

            if (estadoNivel6.fase === 'victoria') {
                ctx.font = 'bold 18px "Courier New", monospace';
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText('Presiona "VOLVER AL MENÚ" arriba a la izquierda para continuar', w / 2, h / 2 + 28);
            }
        }

        animacionIdNivel6 = requestAnimationFrame(bucleNivel6);
    }

    function distanciaPuntoSegmentoN6(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const l2 = dx * dx + dy * dy;
        if (l2 === 0) return Math.hypot(px - x1, py - y1);
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function impactarEnemigosN6(bala, ahora) {
        // 0. Impacto contra el Jefe Final: Dreadnought Redemptor Infectado (50,000 HP)
        if (estadoNivel6.jefeFinalDreadnought) {
            const df = estadoNivel6.jefeFinalDreadnought;
            if (Math.hypot(bala.x - df.x, bala.y - df.y) <= df.radio) {
                df.vida -= (bala.danioJefe || bala.danio || 10);
                df.flashHasta = ahora + 55;
                if (df.vida <= 0) {
                    estadoNivel6.jefeFinalDreadnought = null;
                    estadoNivel6.proyectilesDreadnought = [];
                    estadoNivel6.avisosMisilesDreadnought = [];
                    estadoNivel6.ondasChoqueDreadnought = [];
                    estadoNivel6.enemigosNormales = [];
                }
                return true;
            }
        }

        // 1. Impacto contra Depredadores Alfa (3,000 HP)
        for (let i = 0; i < estadoNivel6.jefesAlfa.length; i++) {
            const j = estadoNivel6.jefesAlfa[i];
            if (Math.hypot(bala.x - j.x, bala.y - j.y) <= j.radio) {
                j.vida -= (bala.danioJefe || bala.danio || 10);
                j.flashHasta = ahora + 65;
                if (j.vida <= 0) estadoNivel6.jefesAlfa.splice(i, 1);
                return true;
            }
        }

        // 2. Impacto contra Monstruos Normales
        for (let i = 0; i < estadoNivel6.enemigosNormales.length; i++) {
            const en = estadoNivel6.enemigosNormales[i];
            if (bala.x >= en.x && bala.x <= en.x + en.tam && bala.y >= en.y && bala.y <= en.y + en.tam) {
                en.vida -= (bala.danioNormal || bala.danio || 10);
                en.flashHasta = ahora + 70;
                if (en.vida <= 0) estadoNivel6.enemigosNormales.splice(i, 1);
                return true;
            }
        }

        // 3. Impacto contra Guardianes Élites
        for (let i = 0; i < estadoNivel6.guardianesElites.length; i++) {
            const g = estadoNivel6.guardianesElites[i];
            if (bala.x >= g.x && bala.x <= g.x + g.tam && bala.y >= g.y && bala.y <= g.y + g.tam) {
                g.vida -= (bala.danioNormal || bala.danio || 10);
                g.flashHasta = ahora + 65;
                if (g.vida <= 0) estadoNivel6.guardianesElites.splice(i, 1);
                return true;
            }
        }
        return false;
    }

    function danarAliadoN6(al, cantidad, ahora) {
        if (!al.vivo || ahora < al.invulnerableHasta) return;
        al.vidas = Math.max(0, al.vidas - cantidad);
        al.invulnerableHasta = ahora + 950;
        if (al.vidas === 0) {
            al.vivo = false;
        }
        actualizarHudNivel6();
    }

    function recibirDanioJugadorNivel6(cantidad = 1) {
        const ahora = Date.now();
        if (ahora < jugador.invulnerableHasta || jugador.vidas <= 0) return;

        if (estadoMarineP2.escudoActivo && !estadoMarineP2.escudoRoto) {
            return;
        }

        jugador.vidas = Math.max(0, jugador.vidas - cantidad);
        jugador.invulnerableHasta = ahora + 1100;
        actualizarCorazonesUI();

        if (jugador.vidas <= 0) {
            puedeMoverse = false;
            estadoNivel6.velAvanceCalle = 0;
            textoContador = 'GAME OVER';
            document.getElementById('titulo-nivel-activo').textContent = 'NIVEL 6 — EL GRAN REGENTE HA CAÍDO';
        }
    }
</script>

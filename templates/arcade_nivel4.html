    function dibujarTextoMultilineaCinematica(texto, x, y, maxWidth, lineHeight) {
        const palabras = texto.split(' ');
        let linea = '';
        let posY = y;

        for (let n = 0; n < palabras.length; n++) {
            const pruebaLinea = linea + palabras[n] + ' ';
            const ancho = ctx.measureText(pruebaLinea).width;
            if (ancho > maxWidth && n > 0) {
                ctx.fillText(linea.trim(), x, posY);
                linea = palabras[n] + ' ';
                posY += lineHeight;
            } else {
                linea = pruebaLinea;
            }
        }
        ctx.fillText(linea.trim(), x, posY);
    }

    function dibujarCinematicaFase2N4(ahora) {
        const w = canvas.width;
        const h = canvas.height;
        const transcurrido = ahora - cinematicaFase2N4.inicioEtapa;

        if (cinematicaFase2N4.etapa === 'explosion') {
            const alfaNegro = Math.min(1, transcurrido / 1350);
            ctx.save();
            ctx.fillStyle = `rgba(0, 0, 0, ${alfaNegro})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();

            particulasN4.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.vida);
                ctx.fillStyle = p.color || '#ffd60a';
                ctx.fillRect(p.x - p.tam / 2, p.y - p.tam / 2, p.tam, p.tam);
                ctx.restore();
            });
        } else if (cinematicaFase2N4.etapa === 'dialogo_negro') {
            ctx.save();
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            dibujarSiluetaBlancaSerafinN4(serafinN4.x, serafinN4.y, 1);
            dibujarSiluetaBlancaOphanimN4(ophanimN4.x, ophanimN4.y, ophanimN4.radio, ophanimN4.rotacionAnillos, 1);

            const temblorX = (Math.random() - 0.5) * 11;
            const temblorY = (Math.random() - 0.5) * 11;
            const boxW = Math.min(780, w * 0.84);
            const boxH = 175;
            const boxX = (w - boxW) / 2 + temblorX;
            const boxY = h * 0.56 + temblorY;

            ctx.fillStyle = '#050505';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(boxX + 6, boxY + 6, boxW - 12, boxH - 12);

            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText('【 SERAFÍN & OPHANIM AL UNÍSONO 】', boxX + 22, boxY + 26);

            const textoVisible = cinematicaFase2N4.textoCompleto.slice(0, cinematicaFase2N4.letrasMostradas);
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillStyle = '#ffffff';
            dibujarTextoMultilineaCinematica(
                textoVisible,
                boxX + 22,
                boxY + 56,
                boxW - 44,
                26
            );

            ctx.restore();
        } else if (cinematicaFase2N4.etapa === 'fusion_blanca') {
            const prog = Math.min(1, transcurrido / 3200);
            const cx = w * 0.5;
            const cy = h * 0.35;

            ctx.save();
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            for (let i = 0; i < 16; i++) {
                const a = (i * Math.PI * 2) / 16 + prog * 4;
                const largoRayo = 90 + prog * 260;
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + prog * 0.6})`;
                ctx.lineWidth = 2 + prog * 4;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(a) * largoRayo, cy + Math.sin(a) * largoRayo);
                ctx.stroke();
            }

            const escala = 1 + prog * 0.55;
            dibujarSiluetaBlancaSerafinN4(serafinN4.x, serafinN4.y, escala);
            dibujarSiluetaBlancaOphanimN4(ophanimN4.x, ophanimN4.y, ophanimN4.radio, ophanimN4.rotacionAnillos, escala);

            const radioNucleo = prog * 130;
            const fusGrad = ctx.createRadialGradient(cx, cy, 4, cx, cy, Math.max(10, radioNucleo));
            fusGrad.addColorStop(0, '#ffffff');
            fusGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.85)');
            fusGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = fusGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, Math.max(10, radioNucleo), 0, Math.PI * 2);
            ctx.fill();

            particulasN4.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.vida);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(p.x - p.tam / 2, p.y - p.tam / 2, p.tam, p.tam);
            });
            ctx.globalAlpha = 1;

            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('⚡ ¡FUSIÓN CELESTIAL ABSOLUTA! ⚡', cx, h * 0.72);
            ctx.restore();
        } else if (cinematicaFase2N4.etapa === 'destello_blanco') {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
    }

    // ==========================================
    // DIBUJO HIPERDETALLADO DEL JEFE FUSIONADO (FASE 2 - 3X TAMAÑO)
    // ==========================================
    function dibujarAlaPlumajeDetalladaN4(largo, ancho, golpeado, esCegador) {
        const wingGrad = ctx.createLinearGradient(0, 0, largo, 0);
        if (esCegador) {
            wingGrad.addColorStop(0, '#ffffff');
            wingGrad.addColorStop(1, '#fef08a');
        } else {
            wingGrad.addColorStop(0, golpeado ? '#38bdf8' : '#18181b');
            wingGrad.addColorStop(0.55, golpeado ? '#bae6fd' : '#27272a');
            wingGrad.addColorStop(1, golpeado ? '#ffffff' : '#09090b');
        }

        ctx.fillStyle = wingGrad;
        ctx.strokeStyle = esCegador ? '#ffffff' : (golpeado ? '#ffffff' : '#d4d4d8');
        ctx.lineWidth = 1.6;

        ctx.beginPath();
        ctx.moveTo(8, -5);
        ctx.quadraticCurveTo(largo * 0.45, -ancho * 1.15, largo, -10);
        const numPuntas = 7;
        for (let i = 0; i < numPuntas; i++) {
            const t = i / numPuntas;
            const px = largo * (1 - t * 0.55);
            const py = -6 + t * (ancho * 1.45);
            ctx.lineTo(px + 10, py + 4);
            ctx.lineTo(px - 6, py + 9);
        }
        ctx.quadraticCurveTo(largo * 0.35, ancho * 0.85, 8, 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = golpeado || esCegador ? '#ffffff' : 'rgba(228, 228, 231, 0.55)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.quadraticCurveTo(largo * 0.5, -ancho * 0.45, largo * 0.92, -6);
        ctx.stroke();

        for (let k = 1; k <= 14; k++) {
            const frac = k / 15;
            const bx = 12 + frac * (largo * 0.82);
            const by = -frac * (ancho * 0.32);
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + 12, by + ancho * 0.65);
            ctx.stroke();
        }
    }

    function dibujarDiosFusionadoN4(d, ahora) {
        if (!d || d.vida <= 0) return;
        const jugCx = jugador.x + jugador.tam / 2;
        const jugCy = jugador.y + jugador.tam / 2;
        const golpeado = ahora < d.danioFlashHasta;
        const esCegador = d.alasExtendidasCegadoras;

        ctx.save();
        ctx.translate(d.x, d.y);

        const auraExterior = ctx.createRadialGradient(0, 0, 18, 0, 0, esCegador ? 220 : 145);
        auraExterior.addColorStop(0, esCegador ? '#ffffff' : (golpeado ? 'rgba(56, 189, 248, 0.7)' : 'rgba(220, 38, 38, 0.55)'));
        auraExterior.addColorStop(0.45, esCegador ? 'rgba(255, 255, 255, 0.65)' : 'rgba(153, 27, 27, 0.28)');
        auraExterior.addColorStop(0.78, 'rgba(24, 24, 27, 0.18)');
        auraExterior.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = auraExterior;
        ctx.beginPath();
        ctx.arc(0, 0, esCegador ? 220 : 145, 0, Math.PI * 2);
        ctx.fill();

        for (let f = 0; f < 18; f++) {
            const angLlama = (f * Math.PI * 2) / 18 + Math.sin(ahora * 0.005 + f) * 0.15;
            const largoLlama = 58 + Math.sin(ahora * 0.012 + f * 1.7) * 16;
            ctx.fillStyle = f % 2 === 0 ? 'rgba(220, 38, 38, 0.65)' : 'rgba(248, 113, 113, 0.45)';
            ctx.beginPath();
            ctx.moveTo(Math.cos(angLlama - 0.14) * 24, Math.sin(angLlama - 0.14) * 24);
            ctx.quadraticCurveTo(
                Math.cos(angLlama + 0.18) * (largoLlama * 0.65),
                Math.sin(angLlama + 0.18) * (largoLlama * 0.65),
                Math.cos(angLlama) * largoLlama,
                Math.sin(angLlama) * largoLlama
            );
            ctx.quadraticCurveTo(
                Math.cos(angLlama - 0.18) * (largoLlama * 0.65),
                Math.sin(angLlama - 0.18) * (largoLlama * 0.65),
                Math.cos(angLlama + 0.14) * 24,
                Math.sin(angLlama + 0.14) * 24
            );
            ctx.fill();
        }

        const batir = esCegador ? 0 : Math.sin(d.aleteo) * 0.18;
        const factorCegador = esCegador ? 1.25 : 1.0;
        const configuracionAlas = [
            { angBase: -0.92 + batir, largo: 128 * factorCegador, ancho: 34 },
            { angBase: 0.08 - batir * 0.85, largo: 136 * factorCegador, ancho: 36 },
            { angBase: 1.05 + batir * 0.6, largo: 108 * factorCegador, ancho: 28 }
        ];

        configuracionAlas.forEach(par => {
            [-1, 1].forEach(lado => {
                ctx.save();
                ctx.scale(lado, 1);
                ctx.rotate(par.angBase);
                dibujarAlaPlumajeDetalladaN4(par.largo, par.ancho, golpeado, esCegador);
                ctx.restore();
            });
        });

        const anillosFusion = [
            { rx: 68, ry: 27, rot: d.rotacionAnillos, claro: false, ojos: 11 },
            { rx: 68, ry: 27, rot: -d.rotacionAnillos * 1.15 + 1.05, claro: true, ojos: 11 },
            { rx: 28, ry: 68, rot: d.rotacionAnillos * 0.9 + 2.1, claro: false, ojos: 11 },
            { rx: 56, ry: 56, rot: -d.rotacionAnillos * 0.7 + 0.5, claro: true, ojos: 12 }
        ];

        anillosFusion.forEach(an => {
            ctx.save();
            ctx.rotate(an.rot);

            ctx.strokeStyle = '#09090b';
            ctx.lineWidth = 11;
            ctx.beginPath();
            ctx.ellipse(0, 0, an.rx, an.ry, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = golpeado ? '#00e5ff' : (an.claro ? '#d4d4d8' : '#27272a');
            ctx.lineWidth = 7.5;
            ctx.beginPath();
            ctx.ellipse(0, 0, an.rx, an.ry, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#f4f4f5';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(0, 0, an.rx, an.ry, 0, 0, Math.PI * 2);
            ctx.stroke();

            for (let k = 0; k < an.ojos; k++) {
                const a = (k * Math.PI * 2) / an.ojos;
                const ox = Math.cos(a) * an.rx;
                const oy = Math.sin(a) * an.ry;

                ctx.fillStyle = '#f4f4f5';
                ctx.beginPath();
                ctx.ellipse(ox, oy, 5.5, 3.5, a, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#09090b';
                ctx.lineWidth = 1.1;
                ctx.stroke();

                ctx.fillStyle = k % 3 === 0 ? '#dc2626' : '#3f3f46';
                ctx.beginPath();
                ctx.arc(ox, oy, 2.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(ox, oy, 1.1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });

        if (!d.alasCerradas) {
            ctx.save();
            ctx.fillStyle = '#18181b';
            ctx.beginPath();
            ctx.ellipse(0, 0, 31, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            const escGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 27);
            escGrad.addColorStop(0, '#ffffff');
            escGrad.addColorStop(0.75, '#e4e4e7');
            escGrad.addColorStop(1, '#7f1d1d');
            ctx.fillStyle = escGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, 27, 17, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f4f4f5';
            ctx.lineWidth = 2;
            ctx.stroke();

            const angMirada = Math.atan2(jugCy - d.y, jugCx - d.x);
            const px = Math.cos(angMirada) * 6.5;
            const py = Math.sin(angMirada) * 4.2;

            const irisGrad = ctx.createRadialGradient(px, py, 1, px, py, 11);
            irisGrad.addColorStop(0, '#fca5a5');
            irisGrad.addColorStop(0.5, '#71717a');
            irisGrad.addColorStop(1, '#18181b');
            ctx.fillStyle = irisGrad;
            ctx.beginPath();
            ctx.arc(px, py, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px - 2.5, py - 2.5, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else {
            [-1, 1].forEach(lado => {
                ctx.save();
                ctx.scale(lado, 1);
                ctx.fillStyle = '#18181b';
                ctx.strokeStyle = '#f4f4f5';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, -38);
                ctx.quadraticCurveTo(44, -14, 36, 36);
                ctx.lineTo(0, 28);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });
        }

        ctx.restore();
    }

    // ==========================================
    // DIBUJO DEL CHOQUE DE PODERES (KAMEHAMEHA)
    // ==========================================
    function dibujarChoquePoderesN4(ahora) {
        if (!choquePoderN4.activo) return;
        const w = canvas.width;
        const h = canvas.height;
        const cx = w * 0.5;
        const jefesY = h * 0.22 + 40;
        const jugY = jugador.y - 10;

        ctx.save();
        ctx.fillStyle = 'rgba(2, 1, 10, 0.45)';
        ctx.fillRect(0, 0, w, h);

        const auraJefes = ctx.createRadialGradient(cx, jefesY, 10, cx, jefesY, 135);
        auraJefes.addColorStop(0, '#ffffff');
        auraJefes.addColorStop(0.35, faseActualN4 === 2 ? 'rgba(220, 38, 38, 0.85)' : 'rgba(255, 214, 10, 0.85)');
        auraJefes.addColorStop(1, 'rgba(255, 214, 10, 0)');
        ctx.fillStyle = auraJefes;
        ctx.beginPath();
        ctx.arc(cx, jefesY, 135, 0, Math.PI * 2);
        ctx.fill();

        const auraJug = ctx.createRadialGradient(cx, jugY, 8, cx, jugY, 85);
        auraJug.addColorStop(0, '#ffffff');
        auraJug.addColorStop(0.4, 'rgba(56, 189, 248, 0.85)');
        auraJug.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = auraJug;
        ctx.beginPath();
        ctx.arc(cx, jugY, 85, 0, Math.PI * 2);
        ctx.fill();

        if (choquePoderN4.fase === 'cargando') {
            ctx.font = 'bold 28px "Courier New", monospace';
            ctx.fillStyle = '#ffd60a';
            ctx.textAlign = 'center';
            ctx.fillText('⚡ ¡ATAQUE SUPREMO DIVINO! ¡PREPÁRATE! ⚡', cx, h * 0.5);
        } else if (choquePoderN4.fase === 'choque') {
            const choqueY = jefesY + (jugY - jefesY) * choquePoderN4.progreso;
            const vibracion = Math.sin(ahora * 0.08) * 5;

            ctx.strokeStyle = faseActualN4 === 2 ? 'rgba(220, 38, 38, 0.5)' : 'rgba(255, 214, 10, 0.45)';
            ctx.lineWidth = 58 + vibracion;
            ctx.beginPath();
            ctx.moveTo(cx, jefesY);
            ctx.lineTo(cx, choqueY);
            ctx.stroke();

            ctx.strokeStyle = '#ffd60a';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.moveTo(cx, jefesY);
            ctx.lineTo(cx, choqueY);
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(cx, jefesY);
            ctx.lineTo(cx, choqueY);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
            ctx.lineWidth = 54 - vibracion;
            ctx.beginPath();
            ctx.moveTo(cx, jugY);
            ctx.lineTo(cx, choqueY);
            ctx.stroke();

            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.moveTo(cx, jugY);
            ctx.lineTo(cx, choqueY);
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(cx, jugY);
            ctx.lineTo(cx, choqueY);
            ctx.stroke();

            const radioColision = 42 + Math.sin(ahora * 0.06) * 7;
            const colGrad = ctx.createRadialGradient(cx, choqueY, 5, cx, choqueY, radioColision * 1.6);
            colGrad.addColorStop(0, '#ffffff');
            colGrad.addColorStop(0.5, '#fef08a');
            colGrad.addColorStop(0.8, '#38bdf8');
            colGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = colGrad;
            ctx.beginPath();
            ctx.arc(cx, choqueY, radioColision * 1.6, 0, Math.PI * 2);
            ctx.fill();

            const restante = Math.max(0, (choquePoderN4.duracionChoque - (ahora - choquePoderN4.inicioFase)) / 1000).toFixed(1);
            ctx.font = 'bold 26px "Courier New", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('🔥 ¡PRESIONA [ESPACIO] RÁPIDO! 🔥', cx, h * 0.48 - 22);

            ctx.font = 'bold 20px "Courier New", monospace';
            ctx.fillStyle = choquePoderN4.pulsaciones >= choquePoderN4.metaPulsaciones ? '#4ade80' : '#ffd60a';
            ctx.fillText(
                `PODER: ${choquePoderN4.pulsaciones} / ${choquePoderN4.metaPulsaciones}  (${restante}s)`,
                cx,
                h * 0.48 + 12
            );
        }

        ctx.restore();
    }

    // ==========================================
    // JUGADOR CON CASCO ESPACIAL
    // ==========================================
    function dibujarJugadorEspacialN4(ahora) {
        const parpadeo = ahora < jugador.invulnerableHasta && Math.floor(ahora / 100) % 2 === 0;
        if (parpadeo) return;

        const x = jugador.x;
        const y = jugador.y;
        const t = jugador.tam;
        const cx = x + t / 2;
        const enMovimiento = teclas.ArrowUp || teclas.ArrowDown || teclas.ArrowLeft || teclas.ArrowRight;

        ctx.save();

        ctx.fillStyle = '#475569';
        ctx.fillRect(x + 3, y + t * 0.45, 5, t * 0.42);
        ctx.fillRect(x + t - 8, y + t * 0.45, 5, t * 0.42);
        if (enMovimiento) {
            const flama = 6 + Math.sin(ahora / 40) * 4;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(x + 3, y + t * 0.87);
            ctx.lineTo(x + 5.5, y + t * 0.87 + flama);
            ctx.lineTo(x + 8, y + t * 0.87);
            ctx.moveTo(x + t - 8, y + t * 0.87);
            ctx.lineTo(x + t - 5.5, y + t * 0.87 + flama);
            ctx.lineTo(x + t - 3, y + t * 0.87);
            ctx.fill();
        }

        ctx.fillStyle = '#e2e8f0';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(x + 6, y + t * 0.52, t - 12, t * 0.44, 5);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(cx - 4, y + t * 0.62, 8, 5);

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx + 8, y + 6);
        ctx.lineTo(cx + 11, y - 4);
        ctx.stroke();
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(cx + 11, y - 5, 2.3, 0, Math.PI * 2);
        ctx.fill();

        const radioCasco = t * 0.42;
        const cascoY = y + t * 0.34;
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cascoY, radioCasco, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const visorGrad = ctx.createLinearGradient(cx - radioCasco, cascoY - 6, cx + radioCasco, cascoY + 8);
        visorGrad.addColorStop(0, '#0284c7');
        visorGrad.addColorStop(0.5, '#0f172a');
        visorGrad.addColorStop(1, '#38bdf8');
        ctx.fillStyle = visorGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cascoY + 1, radioCasco * 0.78, radioCasco * 0.56, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd60a';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
        ctx.beginPath();
        ctx.ellipse(cx - 4.5, cascoY - 2, 4, 1.8, -0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // ==========================================
    // JEFES DE FASE 1
    // ==========================================
    function dibujarOjoIntimidanteN4(x, y, radio, mirarX, mirarY, esPrincipal = false) {
        ctx.save();
        ctx.translate(x, y);

        const escGrad = ctx.createRadialGradient(0, 0, radio * 0.2, 0, 0, radio);
        escGrad.addColorStop(0, '#ffffff');
        escGrad.addColorStop(0.78, '#f1f5f9');
        escGrad.addColorStop(1, '#991b1b');
        ctx.fillStyle = escGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, radio, radio * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = esPrincipal ? '#ffd60a' : '#d97706';
        ctx.lineWidth = esPrincipal ? 2.4 : 1.4;
        ctx.stroke();

        const ang = Math.atan2(mirarY - y, mirarX - x);
        const offsetPupila = radio * 0.24;
        const px = Math.cos(ang) * offsetPupila;
        const py = Math.sin(ang) * offsetPupila * 0.65;

        const irisGrad = ctx.createRadialGradient(px, py, 1, px, py, radio * 0.38);
        irisGrad.addColorStop(0, '#fef08a');
        irisGrad.addColorStop(0.45, '#00b4d8');
        irisGrad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = irisGrad;
        ctx.beginPath();
        ctx.arc(px, py, radio * 0.38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#020617';
        ctx.beginPath();
        ctx.ellipse(px, py, radio * 0.11, radio * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px - radio * 0.1, py - radio * 0.1, radio * 0.08, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function dibujarSerafinN4(s, ahora) {
        if (!s || s.vida <= 0) return;
        const jugCx = jugador.x + jugador.tam / 2;
        const jugCy = jugador.y + jugador.tam / 2;
        const golpeado = ahora < s.danioFlashHasta;

        ctx.save();
        ctx.translate(s.x, s.y);

        const aura = ctx.createRadialGradient(0, 0, 12, 0, 0, 92);
        aura.addColorStop(0, golpeado ? 'rgba(56, 189, 248, 0.55)' : 'rgba(255, 214, 10, 0.38)');
        aura.addColorStop(0.6, 'rgba(220, 38, 38, 0.12)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, 92, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.rotate(ahora * 0.0008);
        for (let i = 0; i < 12; i++) {
            const a = (i * Math.PI * 2) / 12;
            const largoEspina = i % 2 === 0 ? 48 : 34;
            ctx.fillStyle = i % 2 === 0 ? '#ffd60a' : '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(Math.cos(a - 0.08) * 20, Math.sin(a - 0.08) * 20);
            ctx.lineTo(Math.cos(a) * largoEspina, Math.sin(a) * largoEspina);
            ctx.lineTo(Math.cos(a + 0.08) * 20, Math.sin(a + 0.08) * 20);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();

        const batir = Math.sin(s.aleteo) * 0.24;
        const paresAlas = [
            { angBase: -0.62 + batir, largo: 78, ancho: 22 },
            { angBase: 0.04 - batir * 0.85, largo: 90, ancho: 25 },
            { angBase: 0.68 + batir * 0.65, largo: 68, ancho: 19 }
        ];

        paresAlas.forEach(par => {
            [-1, 1].forEach(lado => {
                ctx.save();
                ctx.scale(lado, 1);
                ctx.rotate(par.angBase);

                const wingGrad = ctx.createLinearGradient(8, 0, par.largo, 0);
                wingGrad.addColorStop(0, golpeado ? '#38bdf8' : '#fef3c7');
                wingGrad.addColorStop(0.55, golpeado ? '#bae6fd' : '#ffffff');
                wingGrad.addColorStop(1, golpeado ? '#0284c7' : '#fda4af');

                ctx.fillStyle = wingGrad;
                ctx.strokeStyle = golpeado ? '#ffffff' : '#d97706';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(10, -4);
                ctx.quadraticCurveTo(par.largo * 0.5, -par.ancho * 1.15, par.largo, -8);
                ctx.lineTo(par.largo * 0.84, 0);
                ctx.lineTo(par.largo * 0.94, 8);
                ctx.lineTo(par.largo * 0.72, 11);
                ctx.lineTo(par.largo * 0.80, 18);
                ctx.quadraticCurveTo(par.largo * 0.45, par.ancho * 0.75, 10, 10);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(217, 119, 6, 0.65)';
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.moveTo(14, 0);
                ctx.quadraticCurveTo(par.largo * 0.48, -par.ancho * 0.45, par.largo * 0.85, -2);
                ctx.stroke();

                dibujarOjoIntimidanteN4(par.largo * 0.36, -2, 6.5, jugCx - s.x, jugCy - s.y, false);
                dibujarOjoIntimidanteN4(par.largo * 0.60, -3, 5.8, jugCx - s.x, jugCy - s.y, false);
                dibujarOjoIntimidanteN4(par.largo * 0.80, -3, 4.6, jugCx - s.x, jugCy - s.y, false);

                ctx.restore();
            });
        });

        ctx.fillStyle = golpeado ? '#00e5ff' : '#fffbeb';
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd60a';
        ctx.lineWidth = 3;
        ctx.stroke();

        if (!s.alasCerradas) {
            dibujarOjoIntimidanteN4(0, 0, 21, jugCx, jugCy, true);
        } else {
            [-1, 1].forEach(lado => {
                ctx.save();
                ctx.scale(lado, 1);
                const shieldGrad = ctx.createLinearGradient(0, -28, 32, 28);
                shieldGrad.addColorStop(0, '#ffffff');
                shieldGrad.addColorStop(1, '#fde68a');
                ctx.fillStyle = shieldGrad;
                ctx.strokeStyle = '#d97706';
                ctx.lineWidth = 2.8;
                ctx.beginPath();
                ctx.moveTo(0, -30);
                ctx.quadraticCurveTo(34, -12, 28, 28);
                ctx.lineTo(0, 22);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(5, -14);
                ctx.lineTo(22, -6);
                ctx.moveTo(5, 0);
                ctx.lineTo(24, 6);
                ctx.moveTo(5, 12);
                ctx.lineTo(18, 16);
                ctx.stroke();
                ctx.restore();
            });
        }

        ctx.restore();
    }

    function dibujarOphanimN4(x, y, radio, rotacion, golpeado, esClon) {
        const jugCx = jugador.x + jugador.tam / 2;
        const jugCy = jugador.y + jugador.tam / 2;

        ctx.save();
        ctx.translate(x, y);
        if (esClon) ctx.globalAlpha = 0.85;

        const fuegoGrad = ctx.createRadialGradient(0, 0, radio * 0.4, 0, 0, radio * 1.85);
        fuegoGrad.addColorStop(0, golpeado ? 'rgba(56, 189, 248, 0.55)' : 'rgba(255, 214, 10, 0.42)');
        fuegoGrad.addColorStop(0.55, 'rgba(234, 88, 12, 0.16)');
        fuegoGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = fuegoGrad;
        ctx.beginPath();
        ctx.arc(0, 0, radio * 1.85, 0, Math.PI * 2);
        ctx.fill();

        const anillos = [
            { rx: radio * 1.48, ry: radio * 0.56, rot: rotacion, ojos: 8 },
            { rx: radio * 1.48, ry: radio * 0.56, rot: -rotacion * 1.15 + 1.05, ojos: 8 },
            { rx: radio * 0.58, ry: radio * 1.45, rot: rotacion * 0.9 + 2.1, ojos: 8 },
            { rx: radio * 1.18, ry: radio * 1.18, rot: -rotacion * 0.65, ojos: 10 }
        ];

        anillos.forEach(an => {
            ctx.save();
            ctx.rotate(an.rot);

            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 8.5;
            ctx.beginPath();
            ctx.ellipse(0, 0, an.rx, an.ry, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = golpeado ? '#00e5ff' : '#ffd60a';
            ctx.lineWidth = 5.5;
            ctx.beginPath();
            ctx.ellipse(0, 0, an.rx, an.ry, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(0, 0, an.rx, an.ry, 0, 0, Math.PI * 2);
            ctx.stroke();

            for (let k = 0; k < an.ojos; k++) {
                const a = (k * Math.PI * 2) / an.ojos;
                const ox = Math.cos(a) * an.rx;
                const oy = Math.sin(a) * an.ry;

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(ox, oy, 5.2, 3.4, a, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#0284c7';
                ctx.beginPath();
                ctx.arc(ox, oy, 2.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#020617';
                ctx.beginPath();
                ctx.arc(ox, oy, 1.1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });

        ctx.fillStyle = '#090418';
        ctx.beginPath();
        ctx.arc(0, 0, radio * 0.62, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd60a';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        dibujarOjoIntimidanteN4(0, 0, radio * 0.56, jugCx, jugCy, true);

        ctx.restore();
    }

    function dibujarBarrasVidaJefesN4() {
        const w = canvas.width;

        if (faseActualN4 === 1) {
            const barW = Math.min(310, w * 0.35);
            const barH = 16;
            const y = 46;

            const jefesUI = [
                { jefe: serafinN4, x: w * 0.5 - barW - 24, etiqueta: 'SERAFÍN' },
                { jefe: ophanimN4, x: w * 0.5 + 24, etiqueta: 'OPHANIM' }
            ];

            jefesUI.forEach(item => {
                const pct = Math.max(0, item.jefe.vida / item.jefe.vidaMax);
                ctx.save();
                ctx.fillStyle = 'rgba(10, 4, 24, 0.88)';
                ctx.fillRect(item.x, y, barW, barH);

                const barGrad = ctx.createLinearGradient(item.x, y, item.x + barW, y);
                barGrad.addColorStop(0, '#f59e0b');
                barGrad.addColorStop(0.5, '#ffd60a');
                barGrad.addColorStop(1, '#fef08a');
                ctx.fillStyle = barGrad;
                ctx.fillRect(item.x, y, barW * pct, barH);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(item.x, y, barW, barH);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`${item.etiqueta}: ${item.jefe.vida} / ${item.jefe.vidaMax} HP`, item.x + barW / 2, y + 12);
                ctx.restore();
            });
        } else if (faseActualN4 === 2 && diosFusionadoN4) {
            const barW = Math.min(540, w * 0.62);
            const barH = 18;
            const x = (w - barW) / 2;
            const y = 46;
            const pct = Math.max(0, diosFusionadoN4.vida / diosFusionadoN4.vidaMax);

            ctx.save();
            ctx.fillStyle = 'rgba(10, 4, 24, 0.9)';
            ctx.fillRect(x, y, barW, barH);

            const barGrad = ctx.createLinearGradient(x, y, x + barW, y);
            barGrad.addColorStop(0, '#991b1b');
            barGrad.addColorStop(0.5, '#dc2626');
            barGrad.addColorStop(1, '#f4f4f5');
            ctx.fillStyle = barGrad;
            ctx.fillRect(x, y, barW * pct, barH);

            ctx.strokeStyle = '#f4f4f5';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, barW, barH);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(
                `👁️ DIOS FUSIONADO SERAFÍN-OPHANIM: ${diosFusionadoN4.vida} / ${diosFusionadoN4.vidaMax} HP 👁️`,
                x + barW / 2,
                y + 13
            );
            ctx.restore();
        }
    }

    // ==========================================
    // FONDO CÓSMICO DETALLADO (ESCENARIO BASE)
    // ==========================================
    function dibujarFondoGalaxiaNivel4() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w * 0.5;
        const cy = h * 0.44;
        const radioMax = Math.max(w, h) * 0.7;

        const bgGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, radioMax);
        bgGrad.addColorStop(0, '#230c42');
        bgGrad.addColorStop(0.32, '#110729');
        bgGrad.addColorStop(0.7, '#060212');
        bgGrad.addColorStop(1, '#010004');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        nebulosasN4.forEach(neb => {
            const g = ctx.createRadialGradient(neb.x, neb.y, 10, neb.x, neb.y, neb.r);
            g.addColorStop(0, neb.c1);
            g.addColorStop(1, neb.c2);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
        });

        ctx.save();
        const px = w * 0.12;
        const py = h * 0.18;
        const pGrad = ctx.createRadialGradient(px - 10, py - 10, 4, px, py, 34);
        pGrad.addColorStop(0, '#a5b4fc');
        pGrad.addColorStop(0.55, '#4338ca');
        pGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(px, py, 34, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(216, 180, 254, 0.45)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(px, py, 64, 15, -0.32, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        if (!juegoPausadoN4) anguloGalaxiaN4 += 0.002;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-0.36);
        ctx.scale(1.3, 0.66);

        const halo = ctx.createRadialGradient(0, 0, 8, 0, 0, radioMax * 0.58);
        halo.addColorStop(0, 'rgba(255, 252, 240, 0.98)');
        halo.addColorStop(0.12, 'rgba(243, 232, 255, 0.72)');
        halo.addColorStop(0.32, 'rgba(168, 85, 247, 0.34)');
        halo.addColorStop(0.62, 'rgba(79, 70, 229, 0.15)');
        halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(0, 0, radioMax * 0.58, 0, Math.PI * 2);
        ctx.fill();

        ctx.rotate(anguloGalaxiaN4);
        for (let i = 0; i < brazosGalaxiaN4.length; i++) {
            const pt = brazosGalaxiaN4[i];
            const bx = Math.cos(pt.anguloBase) * pt.radio;
            const by = Math.sin(pt.anguloBase) * pt.radio;
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(bx, by, pt.tam, 0, Math.PI * 2);
            ctx.fill();
        }

        const nucleo = ctx.createRadialGradient(0, 0, 2, 0, 0, 72);
        nucleo.addColorStop(0, '#ffffff');
        nucleo.addColorStop(0.38, 'rgba(254, 243, 199, 0.9)');
        nucleo.addColorStop(1, 'rgba(192, 132, 252, 0)');
        ctx.fillStyle = nucleo;
        ctx.beginPath();
        ctx.arc(0, 0, 72, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        for (let i = 0; i < estrellasN4.length; i++) {
            const st = estrellasN4[i];
            if (!juegoPausadoN4) {
                st.y += st.velY;
                st.x += st.velX;
                st.parpadeo += 0.045;
            }

            if (st.y > h) { st.y = -4; st.x = Math.random() * w; }
            if (st.x < 0) st.x = w;
            if (st.x > w) st.x = 0;

            const brillo = st.alfa * (0.72 + 0.28 * Math.sin(st.parpadeo));
            ctx.globalAlpha = brillo;
            ctx.fillStyle = st.tinte;
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.radio, 0, Math.PI * 2);
            ctx.fill();

            if (st.destelloCruz) {
                ctx.strokeStyle = st.tinte;
                ctx.lineWidth = 0.9;
                ctx.beginPath();
                ctx.moveTo(st.x - st.radio * 3.2, st.y);
                ctx.lineTo(st.x + st.radio * 3.2, st.y);
                ctx.moveTo(st.x, st.y - st.radio * 3.2);
                ctx.lineTo(st.x, st.y + st.radio * 3.2);
                ctx.stroke();
            }
        }
        ctx.globalAlpha = 1;

        if (!juegoPausadoN4 && Math.random() < 0.015 && estrellasFugacesN4.length < 2) {
            estrellasFugacesN4.push({
                x: Math.random() * w,
                y: Math.random() * (h * 0.4),
                vx: -9 - Math.random() * 5,
                vy: 5 + Math.random() * 4,
                vida: 1.0
            });
        }
        estrellasFugacesN4.forEach(ef => {
            if (!juegoPausadoN4) {
                ef.x += ef.vx;
                ef.y += ef.vy;
                ef.vida -= 0.035;
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, ef.vida);
            ctx.strokeStyle = '#e0f2fe';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ef.x, ef.y);
            ctx.lineTo(ef.x - ef.vx * 3.5, ef.y - ef.vy * 3.5);
            ctx.stroke();
            ctx.restore();
        });
        estrellasFugacesN4 = estrellasFugacesN4.filter(ef => ef.vida > 0);
    }

    function bucleNivel4() {
        if (!juegoActivo || nivelActual !== 4) return;
        const ahora = Date.now();

        if (!juegoPausadoN4) {
            if (puedeMoverse && !choquePoderN4.activo && !cinematicaFase2N4.activa) {
                if (teclas.ArrowUp) jugador.y -= jugador.vel;
                if (teclas.ArrowDown) jugador.y += jugador.vel;
                if (teclas.ArrowLeft) jugador.x -= jugador.vel;
                if (teclas.ArrowRight) jugador.x += jugador.vel;

                jugador.x = Math.max(12, Math.min(canvas.width - 12 - jugador.tam, jugador.x));
                jugador.y = Math.max(12, Math.min(canvas.height - 60 - jugador.tam, jugador.y));
            }
            actualizarLogicaNivel4();
        }

        // Renderizar escenario activo (Galaxia, Infierno, Mar Japonés o Gran Tepuy)
        dibujarEscenarioActivoNivel4(ahora);

        if (cinematicaFase2N4.activa) {
            dibujarCinematicaFase2N4(ahora);
            if (juegoPausadoN4) dibujarOverlayPausaN4();
            animacionIdNivel4 = requestAnimationFrame(bucleNivel4);
            return;
        }

        // 1. Aviso de embestida
        const embestidor = (faseActualN4 === 1) ? serafinN4 : diosFusionadoN4;
        if (!choquePoderN4.activo && embestidor && embestidor.vida > 0 && embestidor.estado === 'embestida') {
            const sx = embestidor.embestidaStartX;
            const sy = embestidor.embestidaStartY;
            const ang = Math.atan2(embestidor.embestidaTargetY - sy, embestidor.embestidaTargetX - sx);
            const ex = sx + Math.cos(ang) * 1800;
            const ey = sy + Math.sin(ang) * 1800;
            const anchoFranja = embestidor.radio * 2;

            ctx.save();
            ctx.strokeStyle = 'rgba(255, 214, 10, 0.25)';
            ctx.lineWidth = anchoFranja;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(ex, ey);
            ctx.stroke();

            ctx.strokeStyle = '#ffd60a';
            ctx.lineWidth = 2.5;
            const perpX = -Math.sin(ang) * (anchoFranja / 2);
            const perpY = Math.cos(ang) * (anchoFranja / 2);
            ctx.beginPath();
            ctx.moveTo(sx + perpX, sy + perpY);
            ctx.lineTo(ex + perpX, ey + perpY);
            ctx.moveTo(sx - perpX, sy - perpY);
            ctx.lineTo(ex - perpX, ey - perpY);
            ctx.stroke();
            ctx.restore();
        }

        // 2. Agujeros negros
        agujerosNegrosN4.forEach(ag => {
            const edad = ahora - ag.creadoEn;
            ctx.save();
            if (edad < ag.tiempoAviso) {
                const prog = edad / ag.tiempoAviso;
                ctx.strokeStyle = '#ffd60a';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(ag.x, ag.y, ag.radio, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 214, 10, 0.2)';
                ctx.beginPath();
                ctx.arc(ag.x, ag.y, ag.radio * prog, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#020008';
                ctx.beginPath();
                ctx.arc(ag.x, ag.y, ag.radio, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffd60a';
                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.arc(ag.x, ag.y, ag.radio, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(ag.x, ag.y, ag.radio * 0.72, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        });

        // 3. Clones en los lados
        clonesOphanimN4.forEach(cl => {
            const edad = ahora - cl.creadoEn;
            const ang = Math.atan2(cl.targetY - cl.y, cl.targetX - cl.x);
            const ex = cl.x + Math.cos(ang) * 1800;
            const ey = cl.y + Math.sin(ang) * 1800;

            ctx.save();
            if (edad < cl.tiempoAviso) {
                const esFijo = edad >= cl.tiempoAviso - 400;
                ctx.strokeStyle = esFijo ? '#ff9e00' : 'rgba(255, 214, 10, 0.75)';
                ctx.setLineDash([12, 8]);
                ctx.lineWidth = esFijo ? 4.5 : 3;
                ctx.beginPath();
                ctx.moveTo(cl.x, cl.y);
                ctx.lineTo(ex, ey);
                ctx.stroke();
            } else {
                ctx.strokeStyle = '#ffd60a';
                ctx.lineWidth = 18;
                ctx.beginPath();
                ctx.moveTo(cl.x, cl.y);
                ctx.lineTo(ex, ey);
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(cl.x, cl.y);
                ctx.lineTo(ex, ey);
                ctx.stroke();
            }
            ctx.restore();

            dibujarOphanimN4(cl.x, cl.y, 32, (ophanimN4 ? ophanimN4.rotacionAnillos : ahora * 0.005) * 1.4, false, true);
        });

        // 4. Rayos
        rayosDoradosN4.forEach(r => {
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.rotate(r.angulo);

            ctx.fillStyle = 'rgba(255, 214, 10, 0.35)';
            ctx.fillRect(-r.largo * 0.55, -r.ancho * 0.85, r.largo * 1.1, r.ancho * 1.7);

            ctx.fillStyle = '#ffd60a';
            ctx.fillRect(-r.largo / 2, -r.ancho / 2, r.largo, r.ancho);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-r.largo * 0.45, -r.ancho * 0.24, r.largo * 0.9, r.ancho * 0.48);
            ctx.restore();
        });

        // 5. Corazones de curación cada 20s
        dibujarCorazonesCuracionN4(ahora);

        // 6. Disparos infinitos del jugador
        disparosJugadorN4.forEach(d => {
            ctx.save();
            d.estela.forEach((pt, idx) => {
                ctx.globalAlpha = (idx + 1) / (d.estela.length + 1) * 0.55;
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, d.radio * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#00e5ff';
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.radio, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.radio * 0.48, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 7. Dibujar jefes
        if (faseActualN4 === 1) {
            dibujarSerafinN4(serafinN4, ahora);
            if (ophanimN4 && ophanimN4.vida > 0) {
                dibujarOphanimN4(
                    ophanimN4.x,
                    ophanimN4.y,
                    ophanimN4.radio,
                    ophanimN4.rotacionAnillos,
                    ahora < ophanimN4.danioFlashHasta,
                    false
                );
            }
        } else if (faseActualN4 === 2) {
            dibujarDiosFusionadoN4(diosFusionadoN4, ahora);
        }

        // 8. Choque de poderes supremo
        dibujarChoquePoderesN4(ahora);

        // 9. Portal Dimensional (cada 500 HP)
        dibujarPortalDimensionalN4(ahora);

        // 10. Partículas
        particulasN4.forEach(p => {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.vida);
            ctx.fillStyle = p.color || '#ffd60a';
            ctx.fillRect(p.x - p.tam / 2, p.y - p.tam / 2, p.tam, p.tam);
            ctx.restore();
        });

        // 11. Jugador con casco espacial
        dibujarJugadorEspacialN4(ahora);

        // 12. Destello Cegador Blanco (se desvanece poco a poco)
        if (destelloCegadorN4.activo && destelloCegadorN4.alfaBlanco > 0) {
            ctx.save();
            ctx.fillStyle = `rgba(255, 255, 255, ${destelloCegadorN4.alfaBlanco})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        // 13. Barras de vida
        dibujarBarrasVidaJefesN4();

        // 14. Cuenta regresiva / mensajes
        if (textoContador !== '') {
            ctx.save();
            ctx.font = 'bold 54px "Courier New", monospace';
            ctx.fillStyle = textoContador === 'GAME OVER' ? '#ff1e1e' : '#ffd60a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(textoContador, canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        // 15. Pantalla de Pausa
        if (juegoPausadoN4) {
            dibujarOverlayPausaN4();
        }

        animacionIdNivel4 = requestAnimationFrame(bucleNivel4);
    }

    function dibujarOverlayPausaN4() {
        ctx.save();
        ctx.fillStyle = 'rgba(2, 4, 15, 0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = 'bold 52px "Courier New", monospace';
        ctx.fillStyle = '#ffd60a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⏸ JUEGO EN PAUSA', canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('Presiona [P] o haz clic en "Reanudar" para continuar', canvas.width / 2, canvas.height / 2 + 28);
        ctx.restore();
    }
</script>

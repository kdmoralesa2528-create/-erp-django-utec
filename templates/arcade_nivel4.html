<script>
    let animacionIdNivel4 = null;

    function iniciarNivel4() {
        cancelAnimationFrame(animacionIdNivel4);
        canvas.width = 800;
        canvas.height = 640;

        jugador.x = (canvas.width - jugador.tam) / 2;
        jugador.y = canvas.height - 85;
        jugador.vidasMax = 3;
        jugador.vidas = 3;
        jugador.invulnerableHasta = 0;
        actualizarCorazonesUI();

        const hudEnergia = document.getElementById('cargas-energia');
        if (hudEnergia) {
            hudEnergia.textContent = '💀 NIVEL SECRETO';
            hudEnergia.style.color = '#ff4d6d';
        }

        bucleNivel4();
    }

    function bucleNivel4() {
        if (!juegoActivo || nivelActual !== 4) return;

        if (puedeMoverse) {
            if (teclas.ArrowUp) jugador.y -= jugador.vel;
            if (teclas.ArrowDown) jugador.y += jugador.vel;
            if (teclas.ArrowLeft) jugador.x -= jugador.vel;
            if (teclas.ArrowRight) jugador.x += jugador.vel;

            jugador.x = Math.max(12, Math.min(canvas.width - 12 - jugador.tam, jugador.x));
            jugador.y = Math.max(12, Math.min(canvas.height - 12 - jugador.tam, jugador.y));
        }

        // Lienzo vacío listo para diseñar el Nivel Secreto
        ctx.fillStyle = '#07060a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Jugador
        ctx.save();
        ctx.shadowColor = '#4d82bc';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#4d82bc';
        ctx.fillRect(jugador.x, jugador.y, jugador.tam, jugador.tam);
        ctx.restore();

        if (textoContador !== '') {
            ctx.save();
            ctx.font = 'bold 54px "Courier New", monospace';
            ctx.fillStyle = '#ff4d6d';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(textoContador, canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        animacionIdNivel4 = requestAnimationFrame(bucleNivel4);
    }
</script>

{% load static %}
<script>
    // Limpia cualquier bloque duplicado de "ARCADE — PARTE 2" si dos plantillas lo renderizaron
    document.addEventListener('DOMContentLoaded', () => {
        const titulosParte2 = Array.from(document.querySelectorAll('h1, h2, h3, div, p')).filter(
            el => el.children.length === 0 && el.textContent.includes('ARCADE — PARTE 2')
        );
        if (titulosParte2.length > 1) {
            for (let i = 1; i < titulosParte2.length; i++) {
                const contenedor = titulosParte2[i].closest('section, .arcade-parte2, .nivel-seccion') || titulosParte2[i].parentElement;
                if (contenedor) contenedor.style.display = 'none';
            }
        }
    });

    let animacionIdNivel6_1 = null;
    let estadoNivel6_1 = null;
    let audioNivel6_1 = null;

    // ============================================================
    // 0. CARGADOR DE SPRITES SIN CUADRÍCULA ("CUBO") DE FONDO
    // ============================================================
    const spritesNivel6_1 = {
        jugador: null,
        gabrielCalmado: null,
        gabrielRiendo: null,
        gabrielOscuroFrames: []
    };

    function crearSpriteTransparenteN6_1(url, callback) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
            const off = document.createElement('canvas');
            off.width = img.width;
            off.height = img.height;
            const octx = off.getContext('2d');
            octx.drawImage(img, 0, 0);

            const imgData = octx.getImageData(0, 0, off.width, off.height);
            const d = imgData.data;
            const w = off.width;
            const h = off.height;
            const visitado = new Uint8Array(w * h);

            // Elimina tanto la cuadrícula gris oscura como la gris clara de los bordes
            function esFondoCuadricula(idx) {
                const r = d[idx];
                const g = d[idx + 1];
                const b = d[idx + 2];
                const a = d[idx + 3];
                if (a < 25) return true;
                const maxC = Math.max(r, g, b);
                const minC = Math.min(r, g, b);
                const diff = maxC - minC;
                // Píxeles neutros (grises/blancos de cuadrícula) sin tinte morado ni negro puro de alas
                const esGrisClaro = (diff <= 28 && minC >= 130);
                const esGrisMedioOscuro = (diff <= 14 && maxC <= 135 && minC >= 28 && (b - r) <= 8);
                return esGrisClaro || esGrisMedioOscuro;
            }

            const cola = [];
            for (let x = 0; x < w; x++) {
                cola.push(x, (h - 1) * w + x);
            }
            for (let y = 0; y < h; y++) {
                cola.push(y * w, y * w + (w - 1));
            }

            while (cola.length > 0) {
                const pos = cola.pop();
                if (visitado[pos]) continue;
                visitado[pos] = 1;

                const idx = pos * 4;
                if (esFondoCuadricula(idx)) {
                    d[idx + 3] = 0;
                    const px = pos % w;
                    const py = (pos - px) / w;
                    if (px > 0 && !visitado[pos - 1]) cola.push(pos - 1);
                    if (px < w - 1 && !visitado[pos + 1]) cola.push(pos + 1);
                    if (py > 0 && !visitado[pos - w]) cola.push(pos - w);
                    if (py < h - 1 && !visitado[pos + w]) cola.push(pos + w);
                }
            }

            let minX = w, minY = h, maxX = 0, maxY = 0;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (d[(y * w + x) * 4 + 3] > 25) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            octx.putImageData(imgData, 0, 0);

            if (maxX > minX && maxY > minY) {
                const recorte = document.createElement('canvas');
                recorte.width = maxX - minX + 1;
                recorte.height = maxY - minY + 1;
                recorte.getContext('2d').drawImage(
                    off,
                    minX, minY, recorte.width, recorte.height,
                    0, 0, recorte.width, recorte.height
                );
                callback(recorte);
            } else {
                callback(off);
            }
        };
        img.onerror = function () {
            console.warn('No se pudo cargar sprite en Nivel 6.1:', url);
        };
        img.src = url;
    }

    function precargarSpritesNivel6_1() {
        if (!spritesNivel6_1.jugador) {
            crearSpriteTransparenteN6_1("{% static 'img/arcade/Gemini_Generated_Image_ul4nnul4nnul4nnu.jpg' %}", c => {
                spritesNivel6_1.jugador = c;
            });
        }
        if (!spritesNivel6_1.gabrielCalmado) {
            crearSpriteTransparenteN6_1("{% static 'img/arcade/gabrel_calmado.png' %}", c => {
                spritesNivel6_1.gabrielCalmado = c;
            });
        }
        // Imagen nueva de Gabriel riéndose cuando te hace daño (guárdala como gabriel_riendo.jpg en static/img/arcade/)
        if (!spritesNivel6_1.gabrielRiendo) {
            crearSpriteTransparenteN6_1("{% static 'img/arcade/gabriel_riendo.jpg' %}", c => {
                spritesNivel6_1.gabrielRiendo = c;
            });
        }
        if (spritesNivel6_1.gabrielOscuroFrames.length === 0) {
            const urlsFramesGabriel = [
                "{% static 'img/arcade/Gemini_Generated_Image_sc6a6usc6a6usc6a.jpg' %}",
                "{% static 'img/arcade/Gemini_Generated_Image_sc6a6usc6a6usc6a (1).jpg' %}",
                "{% static 'img/arcade/Gemini_Generated_Image_sc6a6usc6a6usc6a (2).jpg' %}",
                "{% static 'img/arcade/Gemini_Generated_Image_sc6a6usc6a6usc6a (3).jpg' %}",
                "{% static 'img/arcade/Gemini_Generated_Image_sc6a6usc6a6usc6a (4).jpg' %}",
                "{% static 'img/arcade/Gemini_Generated_Image_sc6a6usc6a6usc6a (5).jpg' %}"
            ];
            urlsFramesGabriel.forEach((url, idx) => {
                crearSpriteTransparenteN6_1(url, c => {
                    spritesNivel6_1.gabrielOscuroFrames[idx] = c;
                });
            });
        }
    }

    // ============================================================
    // CONTROL DE MÚSICA (DESBLOQUEO POR TECLA O CLIC)
    // ============================================================
    function asegurarAudioNivel6_1() {
        if (!audioNivel6_1) {
            audioNivel6_1 = new Audio("{% static 'audio/The_Unmaking_Of_Saints.mp3' %}");
            audioNivel6_1.loop = true;
            audioNivel6_1.preload = 'auto';
        }
        return audioNivel6_1;
    }

    function reproducirMusicaNivel6_1() {
        const audio = asegurarAudioNivel6_1();
        audio.volume = 0.65;
        if (audio.paused) {
            audio.play().catch(() => {});
        }
    }

    function detenerMusicaNivel6_1() {
        if (audioNivel6_1) {
            audioNivel6_1.pause();
            audioNivel6_1.currentTime = 0;
        }
    }

    window.addEventListener('pointerdown', () => {
        if (juegoActivo && Number(nivelActual) === 6.1 && jugador.vidas > 0) {
            reproducirMusicaNivel6_1();
        }
    }, true);

    // Controles exclusivos del Nivel 6.1:
    // [W] -> Salta directo a la Oleada 13 (Encuentro con Gabriel)
    // [B] -> Usa botiquín (+1 corazón)
    window.addEventListener('keydown', e => {
        if (!juegoActivo || Number(nivelActual) !== 6.1 || !estadoNivel6_1) return;

        if (jugador.vidas > 0) {
            reproducirMusicaNivel6_1();
        }

        if (e.code === 'KeyW' && !e.repeat) {
            e.preventDefault();
            e.stopImmediatePropagation();
            invocarJefeGabrielDirectoN6_1();
            return;
        }

        if (e.code === 'KeyB' && !e.repeat) {
            e.preventDefault();
            usarBotiquinN6_1();
        }
    }, true);

    function invocarJefeGabrielDirectoN6_1() {
        if (!estadoNivel6_1 || estadoNivel6_1.jefeGabriel) return;
        const ahora = Date.now();
        estadoNivel6_1.oleadaActual = 13;
        estadoNivel6_1.pendientesNormales = 0;
        estadoNivel6_1.enemigosNormales = [];
        estadoNivel6_1.proyectilesAcido = [];
        estadoNivel6_1.charcosAcido = [];
        iniciarEncuentroGabrielN6_1(ahora);
    }

    function usarBotiquinN6_1() {
        if (!estadoNivel6_1) return;
        if (estadoNivel6_1.botiquines <= 0) {
            estadoNivel6_1.mensajeAlerta = '⚠️ NO TIENES BOTIQUINES GUARDADOS';
            estadoNivel6_1.mensajeAlertaHasta = Date.now() + 1400;
            return;
        }
        const ahora = Date.now();
        estadoNivel6_1.botiquines--;
        if (jugador.vidas < jugador.vidasMax) {
            jugador.vidas = Math.min(jugador.vidasMax, jugador.vidas + 1);
            if (typeof actualizarCorazonesUI === 'function') actualizarCorazonesUI();
        }
        estadoNivel6_1.destelloCuraJugadorHasta = ahora + 900;
        estadoNivel6_1.mensajeAlerta = `✚ BOTIQUÍN USADO: +1 CORAZÓN (${estadoNivel6_1.botiquines} RESTANTES)`;
        estadoNivel6_1.mensajeAlertaHasta = ahora + 1800;
        actualizarHudNivel6_1();
    }

    function mantenerEscudoInfinitoN6_1() {
        if (typeof estadoMarineP2 !== 'undefined') {
            estadoMarineP2.escudoRoto = false;
            estadoMarineP2.escudoGolpesRestantes = 999;
        }
    }

    function actualizarHudNivel6_1() {
        const hudEnergia = document.getElementById('cargas-energia');
        const hudDerecha = document.querySelector('.hud-juego span:last-child');
        if (!estadoNivel6_1 || Number(nivelActual) !== 6.1) return;

        mantenerEscudoInfinitoN6_1();

        if (hudDerecha) {
            hudDerecha.textContent = '[FLECHAS] MOVER | [ESPACIO] DISPARAR | [E] ESCUDO (∞) | [B] BOTIQUÍN | [W] JEFE';
            hudDerecha.style.color = '#cbd5e1';
        }
        if (hudEnergia) {
            const txtEscudo = (typeof estadoMarineP2 !== 'undefined' && estadoMarineP2.escudoActivo)
                ? '🛡️ ESCUDO ACTIVO (∞)'
                : '🛡️ [E] INFINITO (∞)';
            hudEnergia.textContent = `⚔️ TEMPLARIO NEGRO | ✚ [B]: ${estadoNivel6_1.botiquines} | 🔥 AMETRALLADORA PESADA | ${txtEscudo}`;
            hudEnergia.style.color = '#facc15';
        }
    }

    // ============================================================
    // 1. INICIALIZACIÓN DEL NIVEL 6.1
    // ============================================================
    function iniciarNivel6_1() {
        cancelAnimationFrame(animacionIdNivel6_1);
        if (typeof intervaloContador !== 'undefined') clearInterval(intervaloContador);
        textoContador = '';

        juegoActivo = true;
        nivelActual = 6.1;

        precargarSpritesNivel6_1();

        if (typeof activarPantallaCompletaParte2 === 'function') {
            activarPantallaCompletaParte2();
        }

        if (!canvas.width || canvas.width < 100) {
            canvas.width = canvas.clientWidth || window.innerWidth || 1000;
        }
        if (!canvas.height || canvas.height < 100) {
            canvas.height = canvas.clientHeight || window.innerHeight || 650;
        }

        const w = canvas.width;
        const h = canvas.height;
        const ahora = Date.now();

        jugador.tam = 44;
        jugador.vidasMax = 10;
        jugador.vidas = 10;
        jugador.invulnerableHasta = 0;
        if (typeof actualizarCorazonesUI === 'function') actualizarCorazonesUI();

        if (typeof estadoMarineP2 !== 'undefined') {
            estadoMarineP2.escudoActivo = false;
            estadoMarineP2.escudoGolpesRestantes = 999;
            estadoMarineP2.escudoRoto = false;
            estadoMarineP2.disparando = false;
            estadoMarineP2.anguloTopDown = -Math.PI / 2;
            estadoMarineP2.balas = [];
            estadoMarineP2.particulas = [];
        }

        const anchoEdificio = Math.max(85, Math.min(135, w * 0.085));

        const offsetsCaidos = [
            { dx: -135, dy: -35, rot: 0.7 },  { dx: -75, dy: -55, rot: -1.1 },
            { dx: 82, dy: -50, rot: 1.9 },    { dx: 140, dy: -28, rot: -0.5 },
            { dx: -155, dy: 30, rot: 2.3 },   { dx: -92, dy: 42, rot: 0.3 },
            { dx: 95, dy: 38, rot: -2.1 },    { dx: 152, dy: 25, rot: 1.2 },
            { dx: -58, dy: 82, rot: -0.8 },   { dx: 64, dy: 80, rot: 2.6 }
        ];
        const soldadosCaidos = offsetsCaidos.map(o => ({
            x: w / 2 + o.dx,
            y: h * 0.68 + o.dy,
            rot: o.rot
        }));

        const edificiosLaterales = [];
        for (let ey = -200; ey < h + 240; ey += 180) {
            edificiosLaterales.push({
                y: ey,
                alto: 168,
                enLlamasIzq: (Math.abs(ey) % 360 === 0),
                enLlamasDer: (Math.abs(ey + 180) % 360 === 0)
            });
        }

        const cochesAvenida = [
            { x: anchoEdificio + 75, y: h * 0.24, ancho: 40, alto: 72, color: '#475569', enLlamas: true },
            { x: w - anchoEdificio - 115, y: h * 0.48, ancho: 42, alto: 76, color: '#7f1d1d', enLlamas: false },
            { x: anchoEdificio + 110, y: h * 0.78, ancho: 40, alto: 72, color: '#3f6212', enLlamas: true }
        ];

        estadoNivel6_1 = {
            fase: 'dialogo_inicial',
            inicioPaso: ahora,
            anchoEdificio: anchoEdificio,
            scrollCalleY: 0,
            velAvanceCalle: 0,
            oscuridadEscenario: 0,
            playerX: w / 2 - jugador.tam / 2,
            playerY: h * 0.68 - jugador.tam / 2,
            moviendoJugador: false,
            destelloCuraJugadorHasta: 0,
            dreadnoughtDerrotado: {
                x: w / 2,
                y: h * 0.27,
                tam: 195
            },
            soldadosCaidos: soldadosCaidos,
            enemigosNormales: [],
            proyectilesAcido: [],
            charcosAcido: [],
            botiquinesCampo: [],
            botiquines: 2,
            oleadaActual: 0,
            totalOleadas: 13,
            proximaOleadaEn: 0,
            pendientesNormales: 0,
            ultimoGoteoSpawn: 0,
            ultimoSpawnBotiquin: ahora,
            jefeGabriel: null,
            estelaEmbestidasGabriel: [],
            lanzasVoladorasGabriel: [],
            edificiosLaterales: edificiosLaterales,
            cochesAvenida: cochesAvenida,
            mensajeAlerta: '',
            mensajeAlertaHasta: 0
        };

        puedeMoverse = false;
        reproducirMusicaNivel6_1();
        const tituloEl = document.getElementById('titulo-nivel-activo');
        if (tituloEl) tituloEl.textContent = 'NIVEL 6.1 — EL JURAMENTO DEL TEMPLARIO';
        actualizarHudNivel6_1();
        bucleNivel6_1();
    }

    // ============================================================
    // 2. OLEADAS 1 A 12
    // ============================================================
    function iniciarSiguienteOleadaN6_1(ahora) {
        if (!estadoNivel6_1) return;
        estadoNivel6_1.oleadaActual++;
        const n = estadoNivel6_1.oleadaActual;

        if (n === 13) {
            iniciarEncuentroGabrielN6_1(ahora);
            return;
        }

        const cantidadEnemigos = (n <= 5) ? 45 : 55;
        estadoNivel6_1.pendientesNormales = cantidadEnemigos;
        estadoNivel6_1.proximaOleadaEn = ahora + 16000;
        estadoNivel6_1.ultimoGoteoSpawn = 0;

        estadoNivel6_1.mensajeAlerta = `⚠️ OLEADA ${n}/13 — ¡${cantidadEnemigos} HORRORES SE APROXIMAN!`;
        estadoNivel6_1.mensajeAlertaHasta = ahora + 2800;
        const tituloEl = document.getElementById('titulo-nivel-activo');
        if (tituloEl) {
            tituloEl.textContent = `NIVEL 6.1 — OLEADA ${n}/13 (${cantidadEnemigos} ENEMIGOS)`;
        }
    }

    function generarEnemigosPendientesN6_1(w, ahora) {
        if (!estadoNivel6_1 || estadoNivel6_1.pendientesNormales <= 0) return;
        const minX = estadoNivel6_1.anchoEdificio + 24;
        const maxX = w - estadoNivel6_1.anchoEdificio - 65;

        if (ahora - estadoNivel6_1.ultimoGoteoSpawn < 180) return;
        estadoNivel6_1.ultimoGoteoSpawn = ahora;

        const lote = Math.min(8, estadoNivel6_1.pendientesNormales);
        for (let i = 0; i < lote; i++) {
            estadoNivel6_1.pendientesNormales--;
            const esAcido = (estadoNivel6_1.pendientesNormales % 6 === 0);
            estadoNivel6_1.enemigosNormales.push({
                x: minX + Math.random() * Math.max(60, maxX - minX),
                y: -40 - Math.random() * 140,
                tam: 31,
                vx: 0,
                vy: 2.5,
                vida: 30,
                vidaMax: 30,
                flashHasta: 0,
                pasoAnim: Math.random() * 10,
                esLanzadorAcido: esAcido,
                ultimoAcido: ahora + 900 + Math.random() * 1200
            });
        }
    }

    // ============================================================
    // 3. ENCUENTRO Y COMBATE CON GABRIEL (OLEADA 13 — 50,000 HP)
    // ============================================================
    function iniciarEncuentroGabrielN6_1(ahora) {
        const w = canvas.width;
        estadoNivel6_1.fase = 'gabriel_intro';
        estadoNivel6_1.inicioPaso = ahora;
        estadoNivel6_1.velAvanceCalle = 0;
        puedeMoverse = false;

        estadoNivel6_1.jefeGabriel = {
            x: w / 2,
            y: 185,
            ancho: 175,
            alto: 165,
            radio: 62,
            vida: 50000,
            vidaMax: 50000,
            flashHasta: 0,
            riendoHasta: 0,
            formaOscura: false,
            alasExtendidas: false,
            jugadorCayoEnTrampa: false,
            textoRespuesta: '',
            estadoCombate: 'flotando',
            inicioEstado: ahora,
            proximoAtaqueEn: ahora + 1100,
            embestidasRestantes: 0,
            embOrigenX: w / 2,
            embOrigenY: 185,
            embDestinoX: w / 2,
            embDestinoY: 185,
            embGolpeo: false,
            rayoAngulo: Math.PI / 2,
            rayoFijado: false,
            rayoGolpeo: false
        };

        const tituloEl = document.getElementById('titulo-nivel-activo');
        if (tituloEl) tituloEl.textContent = 'NIVEL 6.1 — OLEADA 13: EL FALSO ÁNGEL';
    }

    function elegirSiguienteAtaqueGabrielN6_1(g, nRegCx, nRegCy, w, h, ahora) {
        const anchoEd = estadoNivel6_1.anchoEdificio;
        const eleccion = Math.random();

        if (eleccion < 0.38) {
            g.embestidasRestantes = 5;
            prepararSiguienteEmbestidaGabrielN6_1(g, nRegCx, nRegCy, anchoEd, w, h, ahora);
        } else if (eleccion < 0.72) {
            g.estadoCombate = 'aviso_rayo';
            g.inicioEstado = ahora;
            g.alasExtendidas = true;
            g.rayoFijado = false;
            g.rayoAngulo = Math.atan2(nRegCy - (g.y - 36), nRegCx - g.x);
            g.rayoGolpeo = false;
        } else {
            g.estadoCombate = 'invocando_lanzas';
            g.inicioEstado = ahora;
            g.alasExtendidas = true;

            const totalLanzas = 9;
            for (let i = 0; i < totalLanzas; i++) {
                const dirigida = i % 2 === 0;
                const tx = dirigida
                    ? Math.max(anchoEd + 35, Math.min(w - anchoEd - 35, nRegCx + (Math.random() - 0.5) * 160))
                    : anchoEd + 40 + Math.random() * Math.max(80, w - anchoEd * 2 - 80);
                const ty = dirigida
                    ? Math.max(95, Math.min(h - 70, nRegCy + (Math.random() - 0.5) * 160))
                    : 105 + Math.random() * (h - 180);

                const origenX = g.x + (Math.random() - 0.5) * 140;
                const origenY = g.y - 20;
                const ang = Math.atan2(ty - origenY, tx - origenX);

                estadoNivel6_1.lanzasVoladorasGabriel.push({
                    origenX: origenX,
                    origenY: origenY,
                    x: origenX,
                    y: origenY,
                    destinoX: tx,
                    destinoY: ty,
                    angulo: ang,
                    creadaEn: ahora + i * 85,
                    volando: false,
                    impactada: false,
                    impactoEn: 0,
                    golpeo: false
                });
            }
        }
    }

    function prepararSiguienteEmbestidaGabrielN6_1(g, nRegCx, nRegCy, anchoEd, w, h, ahora) {
        g.estadoCombate = 'aviso_embestida';
        g.inicioEstado = ahora;
        g.alasExtendidas = true;
        g.embOrigenX = g.x;
        g.embOrigenY = g.y;
        g.embGolpeo = false;

        const ang = Math.atan2(nRegCy - g.y, nRegCx - g.x);
        const dist = Math.min(580, Math.max(300, Math.hypot(nRegCx - g.x, nRegCy - g.y) + 140));
        g.embDestinoX = Math.max(anchoEd + 55, Math.min(w - anchoEd - 55, g.x + Math.cos(ang) * dist));
        g.embDestinoY = Math.max(105, Math.min(h - 85, g.y + Math.sin(ang) * dist));
    }

    // ============================================================
    // 4. DIBUJO DEL ESCENARIO, JUGADOR, LANZAS, PORTAL Y GABRIEL
    // ============================================================
    function dibujarEscenarioNivel6_1(w, h, ahora) {
        const anchoEd = estadoNivel6_1.anchoEdificio;
        const anchoCalle = w - anchoEd * 2;

        const asfaltoGrad = ctx.createLinearGradient(anchoEd, 0, w - anchoEd, 0);
        asfaltoGrad.addColorStop(0, '#18181b');
        asfaltoGrad.addColorStop(0.5, '#27272a');
        asfaltoGrad.addColorStop(1, '#18181b');
        ctx.fillStyle = asfaltoGrad;
        ctx.fillRect(anchoEd, 0, anchoCalle, h);

        const pasoGrid = 48;
        const offsetGridY = estadoNivel6_1.scrollCalleY % pasoGrid;
        ctx.strokeStyle = 'rgba(161, 161, 170, 0.11)';
        ctx.lineWidth = 1.2;
        for (let gx = anchoEd; gx <= w - anchoEd; gx += pasoGrid) {
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.lineTo(gx, h);
            ctx.stroke();
        }
        for (let gy = offsetGridY - pasoGrid; gy < h + pasoGrid; gy += pasoGrid) {
            ctx.beginPath();
            ctx.moveTo(anchoEd, gy);
            ctx.lineTo(w - anchoEd, gy);
            ctx.stroke();
        }

        const pasoLinea = 96;
        const offsetLinea = estadoNivel6_1.scrollCalleY % pasoLinea;
        ctx.fillStyle = 'rgba(234, 179, 8, 0.36)';
        for (let ly = offsetLinea - pasoLinea; ly < h + pasoLinea; ly += pasoLinea) {
            ctx.fillRect(w / 2 - 3, ly, 6, 44);
        }

        if (spritesNivel6_1.jugador) {
            ctx.save();
            ctx.translate(-Math.cos(angulo) * retrocesoDisparo, -pasoBob - Math.sin(angulo) * retrocesoDisparo);

    function dibujarPortalGabrielN6_1(x, y, progresoApertura, ahora) {
        if (progresoApertura <= 0) return;

        const radioY = 112 * progresoApertura;

        ctx.save();
        ctx.translate(x, y);

        // Aura violeta exterior del portal
        const grad = ctx.createRadialGradient(0, 0, radioX * 0.15, 0, 0, radioY * 1.25);
        grad.addColorStop(0, 'rgba(3, 2, 8, 0.98)');
        grad.addColorStop(0.65, 'rgba(88, 28, 135, 0.85)');
        grad.addColorStop(0.88, 'rgba(216, 180, 254, 0.75)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, 0, radioX * 1.25, radioY * 1.25, 0, 0, Math.PI * 2);
        ctx.fill();

        // Núcleo oscuro giratorio
        ctx.fillStyle = '#030208';
        ctx.strokeStyle = '#e9d5ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, radioX, radioY, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Ojos blancos flotando dentro del abismo del portal
        for (let i = 0; i < 6; i++) {
            const ang = (ahora / 550) + i * (Math.PI / 3);
            const ox = Math.cos(ang) * (radioX * 0.52);
            const oy = Math.sin(ang) * (radioY * 0.52);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ox, oy, 3 * progresoApertura, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    function distanciaPuntoASegmentoN6_1(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        if (len2 === 0) return Math.hypot(px - x1, py - y1);
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function impactarEnemigosNivel6_1(bala, ahora) {

                g.vida -= (bala.danioJefe || 20);
                g.flashHasta = ahora + 55;
                if (g.vida <= 0) {
                    // En lugar de explotar, inicia la secuencia de portal y despedida
                    g.vida = 0;
                    g.estadoCombate = 'flotando';
                    g.riendoHasta = ahora + 5500;
                    estadoNivel6_1.fase = 'gabriel_derrota_portal';
                    estadoNivel6_1.inicioPaso = ahora;
                    estadoNivel6_1.lanzasVoladorasGabriel = [];
                    puedeMoverse = false;
                }
                return true;
            }
        }

        for (let i = 0; i < estadoNivel6_1.enemigosNormales.length; i++) {
            const en = estadoNivel6_1.enemigosNormales[i];
            if (bala.x >= en.x && bala.x <= en.x + en.tam && bala.y >= en.y && bala.y <= en.y + en.tam) {
                en.vida -= (bala.danioNormal || 15);
                en.flashHasta = ahora + 70;
                if (en.vida <= 0) estadoNivel6_1.enemigosNormales.splice(i, 1);
                return true;
            }
        }
        return false;
    }

        jugador.invulnerableHasta = ahora + 1100;
        if (typeof actualizarCorazonesUI === 'function') actualizarCorazonesUI();

        if (jugador.vidas <= 0) {
            puedeMoverse = false;
            estadoNivel6_1.velAvanceCalle = 0;
            detenerMusicaNivel6_1();
            textoContador = 'GAME OVER';
            const tituloEl = document.getElementById('titulo-nivel-activo');
            if (tituloEl) tituloEl.textContent = 'NIVEL 6.1 — EL TEMPLARIO HA CAÍDO';
        }
    }

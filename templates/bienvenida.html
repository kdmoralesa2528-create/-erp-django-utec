{% extends "base.html" %}
{% block title %}Inicio{% endblock %}

{% block content %}
<div class="text-center py-4">
    <h1 id="logo-secreto" style="font-family:'Playfair Display',serif; color:var(--clr-navy); font-size:2.2rem; user-select:none; cursor:pointer; display:inline-block; transition: all 0.2s ease;">
        📦 ERP Django
    </h1>
    <p style="color:var(--clr-muted);font-size:1.05rem;"></p>
    <div class="d-flex justify-content-center gap-2 mt-2 flex-wrap">
        <span class="badge-erp-gold">Django 4.2 LTS</span>
        <span class="badge-erp-gold">Python 3.11</span>
        <span class="badge-erp-gold">Fable 5 AzulERP</span>
    </div>
</div>

<div class="row g-3 mt-2">
    {% for m in modulos %}
    <div class="col-md-4">
        <div class="erp-card text-center" style="cursor:pointer;" onclick="window.location='{{ m.url }}'">
            <div style="font-size:2rem;margin-bottom:.4rem;">{{ m.icono }}</div>
            <strong style="color:var(--clr-navy);">{{ m.nombre }}</strong>
            <p style="color:var(--clr-muted);font-size:.85rem;margin:.3rem 0 0;">
                {{ m.descripcion }}
            </p>
        </div>
    </div>
    {% endfor %}
</div>

<script>
    (function() {
        const logo = document.getElementById('logo-secreto');
        const colorOriginal = logo.style.color;
        let clics = 0;
        let temporizador;

        function apagarBrillo() {
            logo.style.color = colorOriginal;
            logo.style.textShadow = 'none';
            logo.style.transform = 'scale(1)';
        }

        logo.addEventListener('click', function() {
            clics++;
            clearTimeout(temporizador);

            // Brillo amarillo #FFF52D que aumenta con cada clic
            const intensidad = clics * 6;
            logo.style.color = '#FFF52D';
            logo.style.textShadow = `0 0 ${intensidad}px #FFF52D, 0 0 ${intensidad * 2}px #FFF52D`;
            logo.style.transform = `scale(${1 + clics * 0.03})`;

            if (clics >= 5) {
                setTimeout(() => {
                    clics = 0;
                    window.location.href = "{% url 'arcade' %}";
                }, 180);
            } else {
                temporizador = setTimeout(() => {
                    clics = 0;
                    apagarBrillo();
                }, 1500);
            }
        });
    })();
</script>
{% endblock %}
